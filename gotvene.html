<style>
/* Layout: tabs (plan, shopping, recipes); plan and shopping share the week picker; rows expand in place to edit */

.opt:first-child { border-top: 0 }

/* shopping */
.sum3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }

.sum3 span { font-size: .8rem; color: var(--muted) }
.sum3 b { font-family: var(--display); font-size: 1.5rem; line-height: 1.15; font-variant-numeric: tabular-nums }
.sum3 .done b { color: var(--ok) } .sum3 .left b { color: var(--wait) }
.bar { display: flex; height: 5px; border-radius: 99px; background: var(--line); overflow: hidden }
.bar span { display: block; height: 100%; background: var(--ok) }
.xbtn { border: 0; background: none; color: var(--muted); font-size: 1.2rem; line-height: 1; padding: 2px 6px; border-radius: 8px }

/* multi-select */
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 18; width: min(640px, calc(100% - 24px)); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.18) }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: .9rem; z-index: 20; max-width: calc(100% - 32px) }
.btn, .chipbtn, .wchip, .opt, .tabs button, .appnav a { -webkit-tap-highlight-color: transparent; touch-action: manipulation }

}
</style>

<script>
/* collections: recipes/<id> {cat, name, check, note, keeps, auto, isNew, fav, ing: ["Пилешко филе 800 г", …]};
   meals/<id> {date, kind: cook|dessert|breakfast, recipe, note, done, order, noShop};
   gshop/<id> {week, key, done} for ticked list items, or {week, name, extra: true, done} for added ones */
const KEYS = { recipes: 'rec', meals: 'meals', gshop: 'shop' };
const S = { rec: {}, meals: {}, shop: {}, got: {}, noDb: false, readOnly: false,
  tab: 'plan', week: '', open: new Set(), sel: null, armed: null, dirty: false, pick: null, shopOpen: null, pq: '', rq: '', rcat: '', rflag: '' };
const LOCAL = { recipes: {}, meals: {}, gshop: {} };
let db = null;
try { const v = localStorage.getItem('zad-cook-tab'); if (['plan', 'shop', 'rec'].includes(v)) S.tab = v; } catch (e) {}

const root = document.getElementById('root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => keyOf(new Date());
const dt = k => new Date(k + 'T12:00');
const addDays = (k, n) => { const d = dt(k); d.setDate(d.getDate() + n); return keyOf(d); };
const weekOf = k => { const d = dt(k); d.setDate(d.getDate() - d.getDay()); return keyOf(d); };
const WDL = ['неделя', 'понеделник', 'вторник', 'сряда', 'четвъртък', 'петък', 'събота'];
const ML = ['януари', 'февруари', 'март', 'април', 'май', 'юни', 'юли', 'август', 'септември', 'октомври', 'ноември', 'декември'];
const MS = ['ян', 'фев', 'мар', 'апр', 'май', 'юни', 'юли', 'авг', 'сеп', 'окт', 'ное', 'дек'];
const cap = s => s.replace(/^./, c => c.toUpperCase());
const dayName = k => { const d = dt(k); return `${cap(WDL[d.getDay()])}, ${d.getDate()} ${ML[d.getMonth()]}`; };
const weekLabel = w => { const a = dt(w), b = dt(addDays(w, 6));
  return a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MS[a.getMonth()]}` : `${a.getDate()} ${MS[a.getMonth()]} – ${b.getDate()} ${MS[b.getMonth()]}`; };
const CATS = [['main', 'Основни'], ['side', 'Гарнитури и салати'], ['dessert', 'Десерти'], ['breakfast', 'Закуски']];
const CATL = Object.fromEntries(CATS);
const KINDS = [['breakfast', 'Закуска'], ['cook', 'Готвене'], ['dessert', 'Десерт']];
const kindOf = cat => cat === 'dessert' ? 'dessert' : cat === 'breakfast' ? 'breakfast' : 'cook';
const catsFor = kind => kind === 'cook' ? ['main', 'side'] : [kind];
const keepsTxt = n => n >= 7 ? 'държи седмица' : n >= 2 ? `за ${n} дни` : 'яде се веднага';
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2800); }

/* ---------- ingredients → shopping list ---------- */
const UNIT = { 'г': ['г', 1], 'гр': ['г', 1], 'кг': ['г', 1000], 'мл': ['мл', 1], 'л': ['мл', 1000], 'бр': ['бр', 1], 'с.л.': ['с.л.', 1], 'ч.л.': ['ч.л.', 1],
  'пак': ['пак', 1], 'пакет': ['пак', 1], 'връзка': ['връзка', 1], 'връзки': ['връзка', 1], 'скилидки': ['скилидки', 1], 'скилидка': ['скилидки', 1], 'парче': ['парче', 1], 'кутия': ['бр', 1], 'глава': ['бр', 1] };
const LINE = /^(.+?)\s+(\d+(?:[.,]\d+)?)\s*(кг|гр|г|мл|л|бр|с\.л\.|ч\.л\.|пакет|пак|връзки|връзка|скилидки|скилидка|парче|кутия|глава)?\.?$/i;
function parseIng(s) {
  s = String(s || '').trim().replace(/^[-•*]\s*/, '').replace(/\s+—\s+|\s+-\s+|:\s*/g, ' ');
  const m = s.match(LINE);
  if (!m) return { n: s, q: 0, u: '' };
  const u = UNIT[(m[3] || 'бр').toLowerCase()] || ['бр', 1];
  return { n: m[1].replace(/[,;]$/, '').trim(), q: parseFloat(m[2].replace(',', '.')) * u[1], u: u[0] };
}
const fmtNum = n => (Math.round(n * 10) / 10).toLocaleString('bg-BG', { maximumFractionDigits: 1 });
function fmtQty(q, u) {
  if (!q) return '';
  if (u === 'г' && q >= 1000) return fmtNum(q / 1000) + ' кг';
  if (u === 'мл' && q >= 1000) return fmtNum(q / 1000) + ' л';
  return fmtNum(q) + ' ' + u;
}
const ingLine = i => i.q ? `${i.n} ${fmtQty(i.q, i.u)}` : i.n;
const GROUPS = [
  ['frozen', 'Замразени', /замразен/i],
  ['cans', 'Консерви, сосове и подправки за купуване', /консерва|пасата|кокосово|песто|тахан|майонеза|кисели краставички|оризов оцет|нори|горчица/i],
  ['sweet', 'Сладко и ядки', /шоколад|бисквит|бишкоти|пудинг|фурми|фъст|орехи|шамфъст|оризовки|протеин|кондензирано|кафява захар|пудра/i],
  ['meat', 'Месо и риба', /пилеш|пиле|кайма|свинск|телеш|бекон|шунка|кренвирш|сьомга|риба|скариди|бутчета/i],
  ['dairy', 'Мляко, сирена и яйца', /мляко|сирене|кашкавал|сметана|^масло|пармезан|моцарела|маскарпоне|рикота|скир|яйц/i],
  ['veg', 'Плодове и зеленчуци', /картоф|лук|морков|чесън|домат|краставиц|чушк|тиквичк|гъби|зеле|карфиол|лимон|лайм|авокадо|банан|ябълк|магданоз|копър|целина|спанак|лапат|коприва|джинджифил/i],
  ['dry', 'Паста, ориз, бобови и тесто', /паста|спагети|фиде|ориз|кори|леща|боб|нахут|ньоки|галета|лаваш|овесени|зърнена/i],
  ['bread', 'Хляб', /хляб/i],
  ['home', 'Провери дали имаш вкъщи', /^(сол|черен пипер|олио|зехтин|брашно|захар|червен пипер|пушен червен пипер|чубрица|кимион|джоджен|риган|розмарин|канела|ванилия|сода|бакпулвер|оцет|соев сос|доматено пюре|мед|какао|кафе|суха мая|бульон|къри|бяло вино)/i],
];
const groupOf = n => { const s = n.toLowerCase(); const hit = GROUPS.find(([k, , re]) => k === 'home' && re.test(s)) || GROUPS.find(([, , re]) => re.test(s)); return hit ? hit[0] : 'other'; };
const GL = Object.fromEntries(GROUPS.map(([k, l]) => [k, l])); GL.other = 'Друго'; GL.extra = 'Добавени от теб';
const GORDER = ['veg', 'meat', 'dairy', 'dry', 'bread', 'frozen', 'cans', 'sweet', 'other', 'extra', 'home'];

const mealsOfWeek = w => Object.entries(S.meals).filter(([, m]) => m.date && weekOf(m.date) === w)
  .sort((a, b) => a[1].date.localeCompare(b[1].date) || KINDS.findIndex(k => k[0] === a[1].kind) - KINDS.findIndex(k => k[0] === b[1].kind) || (a[1].order ?? 0) - (b[1].order ?? 0));
function shopList(w) {
  const map = {};
  mealsOfWeek(w).forEach(([, m]) => { const r = S.rec[m.recipe]; if (!r || m.noShop) return;
    (r.ing || []).forEach(s => { const i = parseIng(s); if (!i.n) return;
      const key = `${w}|${i.n.toLowerCase()}`;
      const o = map[key] || (map[key] = { key, name: i.n, parts: {}, g: groupOf(i.n), for: [] });
      if (i.q) o.parts[i.u] = (o.parts[i.u] || 0) + i.q; if (!o.for.includes(r.name)) o.for.push(r.name); }); });
  Object.values(map).forEach(o => o.qty = Object.entries(o.parts).map(([u, q]) => fmtQty(q, u)).join(' + '));
  const items = Object.values(map);
  Object.entries(S.shop).forEach(([id, x]) => { if (x.extra && x.week === w) items.push({ key: id, id, name: x.name, qty: '', g: 'extra', for: [], extra: true }); });

  return items.sort((a, b) => GORDER.indexOf(a.g) - GORDER.indexOf(b.g) || a.name.localeCompare(b.name, 'bg'));

/* ---------- writes (same approach as the other pages: keep new docs locally until saved, retry short failures) ---------- */
const pend = {}, busy = {}, creating = {};
const sleep = ms => new Promise(r => setTimeout(r, ms));

function onWriteError(e) {
  if (e && (e.code === 'not_granted' || e.code === 'permission_denied')) { if (!S.readOnly) { S.readOnly = true; render(); } }
  else toast('Промяната не се записа. Провери връзката и опитай пак.');
}
const current = (col, id) => LOCAL[col][id] || S[KEYS[col]][id];
async function attempt(fn) { let last; for (let i = 0; i < 5; i++) { try { return await fn(); } catch (e) { last = e; if (fatal(e)) throw e; await sleep(500 * (i + 1) + Math.random() * 400); } } throw last; }
async function save(col, id, patch, isNew) {
  if (!db || S.readOnly) return;
  const key = col + '/' + id;
  pend[key] = Object.assign(pend[key] || {}, patch);
  if (isNew) creating[key] = true;
  if (busy[key]) return;
  busy[key] = true;
  while (pend[key]) {
    const p = pend[key]; delete pend[key];
    const ref = db.collection(col).doc(id);
    try {
      if (creating[key]) { await attempt(() => ref.set(Object.assign({}, current(col, id), p))); delete creating[key]; delete LOCAL[col][id]; }
      else {
        try { await attempt(() => ref.update(p)); }
        catch (e) { if (e && e.code === 'not_found' && S[KEYS[col]][id]) await attempt(() => ref.set(Object.assign({}, S[KEYS[col]][id], p))); else throw e; }
      }
    } catch (e) {
      if (creating[key]) { delete creating[key]; delete LOCAL[col][id]; delete S[KEYS[col]][id]; render(); }
      onWriteError(e);
    }
  }

}
function create(col, id, data) { LOCAL[col][id] = data; S[KEYS[col]][id] = data; save(col, id, {}, true); }
async function remove(col, id) { delete LOCAL[col][id]; delete S[KEYS[col]][id]; if (!db || S.readOnly) return; try { await attempt(() => db.collection(col).doc(id).delete()); } catch (e) { onWriteError(e); } }
const patcher = col => (id, p) => { const o = S[KEYS[col]][id]; if (!o) return; Object.assign(o, p); if (LOCAL[col][id]) Object.assign(LOCAL[col][id], p); save(col, id, p); };
const setR = patcher('recipes'), setM = patcher('meals');

/* ---------- choosing dishes ---------- */
const lastUsed = () => { const u = {}; Object.values(S.meals).forEach(m => { if (m.recipe && (!u[m.recipe] || m.date > u[m.recipe])) u[m.recipe] = m.date; }); return u; };
const usedCount = () => { const u = {}; Object.values(S.meals).forEach(m => { u[m.recipe] = (u[m.recipe] || 0) + 1; }); return u; };
// least recently planned first, with a little randomness among the top few
function suggest(cats, { minKeeps = 0, avoid = new Set() } = {}) {
  const lu = lastUsed();
  const pool = Object.entries(S.rec).filter(([id, r]) => cats.includes(r.cat) && r.auto !== false && (r.ing || []).length && (Number(r.keeps) || 1) >= minKeeps && !avoid.has(id))
    .sort((a, b) => (lu[a[0]] || '').localeCompare(lu[b[0]] || ''));
  if (!pool.length) return null;
  return pool[Math.floor(Math.random() * Math.min(5, pool.length))][0];
}
function planWeek(w) {
  const avoid = new Set(mealsOfWeek(w).map(([, m]) => m.recipe)), prev = mealsOfWeek(addDays(w, -7));
  let n = 0; const add = (date, kind, recipe) => { if (!recipe) return; avoid.add(recipe); create('meals', uid('g'), { date, kind, recipe, note: '', done: false, order: n++, noShop: false }); };
  const sun = w, wed = addDays(w, 3), sat = addDays(w, 6);
  add(sun, 'cook', suggest(['main'], { minKeeps: 3, avoid })); add(sun, 'cook', suggest(['main'], { minKeeps: 3, avoid })); add(sun, 'cook', suggest(['side'], { minKeeps: 1, avoid }));
  add(wed, 'cook', suggest(['main'], { minKeeps: 2, avoid })); add(wed, 'cook', suggest(['main'], { minKeeps: 3, avoid })); add(wed, 'cook', suggest(['side'], { avoid }));
  if (!prev.some(([, m]) => m.kind === 'dessert')) add(sun, 'dessert', suggest(['dessert'], { minKeeps: 2, avoid }));
  [sun, wed, sat].forEach(d => add(d, 'breakfast', suggest(['breakfast'], { avoid })));
}

function pickWeek(ws) {

}
const tagsHtml = r => { if (!r) return ''; const t = [];

      <button class="item-main" data-act="pick" data-id="${esc(id)}" aria-pressed="${on}"><span class="item-name">${esc(r.name)}</span>${note ? `<span class="item-note">${esc(note)}</span>` : ''}</button><span></span></div></div>`; }
  const open = S.open.has(id);
  let h = `<div class="item"><div class="item-row" style="grid-template-columns:1fr auto">
    <button class="item-main" data-act="toggle" data-id="${esc(id)}" aria-expanded="${open}"><span class="item-name">${esc(r.name)}</span>${tagsHtml(r)}${note ? `<span class="item-note">${esc(note)}</span>` : ''}</button>
    <span class="sec-meta">${(r.ing || []).length ? '' : 'без съставки'}</span></div>`;
  if (open) { const armed = S.armed === 'r:' + id, w = S.week || weekOf(today());
    const days = [...Array(14).keys()].map(i => addDays(weekOf(today()) > w ? weekOf(today()) : w, i)).map(d => `<option value="${d}">${esc(dayName(d))}</option>`).join('');
    h += `<div class="edit" style="padding-left:14px">
      <div class="row2"><label class="f">Име<input id="r-name-${esc(id)}" data-rid="${esc(id)}" data-f="name" value="${esc(r.name)}"${dis}></label>
      <label class="f">Вид<select data-rid="${esc(id)}" data-f="cat"${dis}>${CATS.map(([c, l]) => `<option value="${c}"${r.cat === c ? ' selected' : ''}>${l}</option>`).join('')}</select></label></div>
      <div class="row2"><label class="f">Колко дни държи в хладилника<input id="r-keeps-${esc(id)}" data-rid="${esc(id)}" data-f="keeps" inputmode="numeric" value="${Number(r.keeps) || 1}"${dis}></label>
      <label class="f">Бележка<input id="r-note-${esc(id)}" data-rid="${esc(id)}" data-f="note" value="${esc(r.note)}" placeholder="напр. рецептата е в Инстаграм"${dis}></label></div>
      <label class="f">Продукти, по един на ред: име и количество (за двама, за целия съд)<textarea id="r-ing-${esc(id)}" data-rid="${esc(id)}" data-f="ing" placeholder="Пилешко филе 800 г&#10;Яйца 2 бр&#10;Сол"${dis}>${esc((r.ing || []).join('\n'))}</textarea></label>
      <div class="cbs"><label><input type="checkbox" data-rid="${esc(id)}" data-f="check" ${r.check ? 'checked' : ''}${dis}> За проверка</label>
      <label><input type="checkbox" data-rid="${esc(id)}" data-f="isNew" ${r.isNew ? 'checked' : ''}${dis}> Ново, за пробване</label>
      <label><input type="checkbox" data-rid="${esc(id)}" data-f="auto" ${r.auto !== false ? 'checked' : ''}${dis}> Предлагай го в нова седмица</label></div>
      ${S.readOnly ? '' : `<div class="add" style="border:1px solid var(--line);border-radius:10px"><select class="day-in" id="rp-day-${esc(id)}" aria-label="Ден" style="flex:1 1 180px">${days}</select><button class="btn" data-act="toplan" data-id="${esc(id)}">Добави в плана</button></div>`}
      <div class="edit-foot"><button class="btn" data-act="toggle" data-id="${esc(id)}">Готово</button>
      <button class="btn danger${armed ? ' armed' : ''}" data-act="delrec" data-id="${esc(id)}"${dis}>${armed ? 'Да, изтрий' : 'Изтрий'}</button></div></div>`; }
  return h + `</div>`;
}
// when the selection is exactly one or more whole days, name them
function dayText() {
  if (S.tab !== 'plan') return '';
  const days = [...new Set([...S.sel].map(x => S.meals[x] && S.meals[x].date).filter(Boolean))];
  if (!days.every(d => Object.entries(S.meals).filter(([, m]) => m.date === d).every(([x]) => S.sel.has(x)))) return '';
  return days.length === 1 ? `Цял ден: ${dayName(days[0]).toLowerCase()} (${S.sel.size})` : `Цели дни: ${days.length} (${S.sel.size} ястия)`;
}
function selBar() {
  const n = S.sel.size, armed = S.armed === 'seldel', rec = S.tab === 'rec';
  return `<div class="selbar" role="region" aria-label="Избрани"><span class="selcount">${n && dayText() ? dayText() : n ? `Избрани: ${n}` : rec ? 'Докосни ястията, които искаш' : 'Докосни ястията от плана'}</span>
    <span class="selbtns"><button class="btn" data-act="selall">Избери всички</button>${n ? `<button class="btn" data-act="selnone">Махни избора</button>` : ''}
    <button class="btn danger${armed ? ' armed' : ''}" data-act="seldel"${n ? '' : ' disabled'}>${armed ? `Да, изтрий ${n}` : 'Изтрий избраните'}</button></span></div>`;
}

/* ---------- events ---------- */
function shopText(w) {
  const items = shopList(w).filter(i => !i.done); let g = '', t = `Пазаруване ${weekLabel(w)}\n`;
  items.forEach(i => { if (i.g !== g) { g = i.g; t += `\n${GL[g]}\n`; } t += `- ${i.name}${i.qty ? ' — ' + i.qty : ''}\n`; });
  return t;
}
root.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'FORM' || ((b.tagName === 'INPUT' || b.tagName === 'SELECT') && !['pick', 'pickday'].includes(b.dataset.act))) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (!['delmeal', 'delrec', 'seldel'].includes(act)) S.armed = null;
  if (act === 'tab') { S.tab = b.dataset.v; S.sel = null; S.open.clear(); S.pick = null; try { localStorage.setItem('zad-cook-tab', S.tab); } catch (err) {} }
  else if (act === 'week') { S.week = b.dataset.v; S.open.clear(); S.sel = null; S.pick = null; }
  else if (act === 'newweek') { const ws = allWeeks(), t = weekOf(today()); const w = ws.length ? (ws[ws.length - 1] < t ? t : addDays(ws[ws.length - 1], 7)) : t;
    planWeek(w); S.week = w; S.open.clear(); toast('Нова седмица: ' + weekLabel(w) + '. Смени каквото не ти харесва.'); }
  else if (act === 'toggle') { if (S.open.has(id)) { S.open.delete(id); if (S.pick === id) S.pick = null; } else S.open.add(id); }
  else if (act === 'openpick') { S.pick = S.pick === id ? null : id; S.pq = ''; }
  else if (act === 'swap') { const r = S.rec[b.dataset.r]; setM(id, { recipe: b.dataset.r }); S.pick = null; toast('Сменено с: ' + r.name); }
  else if (act === 'other') { const m = S.meals[id], cur = S.rec[m.recipe];
    const cats = cur ? [cur.cat] : catsFor(m.kind), avoid = new Set(mealsOfWeek(weekOf(m.date)).map(([, x]) => x.recipe));
    const nr = suggest(cats, { minKeeps: m.kind === 'cook' && cur && cur.cat === 'main' ? Math.min(2, Number(cur.keeps) || 1) : 0, avoid });
    if (nr) { setM(id, { recipe: nr }); toast('Предложение: ' + S.rec[nr].name); } else toast('Няма друго подходящо ястие.'); }
  else if (act === 'delmeal') { const m = S.meals[id];
    if (S.armed === 'm:' + id && m) { S.armed = null; S.open.delete(id); remove('meals', id); toast('Махнато: ' + ((S.rec[m.recipe] || {}).name || 'ястие')); } else S.armed = 'm:' + id; }
  else if (act === 'selmode') { S.sel = S.sel ? null : new Set(); S.open.clear(); S.pick = null; }
  else if (act === 'pickday') { const ids = mealsOfWeek(weekOf(b.dataset.d)).filter(([, m]) => m.date === b.dataset.d).map(([x]) => x);
    if (!S.sel) { S.sel = new Set(); S.open.clear(); S.pick = null; }
    if (ids.every(x => S.sel.has(x))) ids.forEach(x => S.sel.delete(x)); else ids.forEach(x => S.sel.add(x));
    if (!S.sel.size) S.sel = null; }
  else if (act === 'shopweek') { const w = b.dataset.v; S.shopOpen.has(w) ? S.shopOpen.delete(w) : S.shopOpen.add(w); }
  else if (act === 'pick') { if (S.sel) S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); }
  else if (act === 'selall') root.querySelectorAll('button[data-act="pick"]').forEach(x => S.sel.add(x.dataset.id));
  else if (act === 'selnone') S.sel.clear();
  else if (act === 'seldel') {
    if (S.armed === 'seldel') { S.armed = null; let n = 0; [...S.sel].forEach(x => { if (S.meals[x]) { remove('meals', x); n++; } else if (S.rec[x]) { remove('recipes', x); n++; } }); S.sel = null; toast((S.tab === 'rec' ? 'Изтрити: ' : 'Махнати: ') + n); }
    else if (S.sel.size) S.armed = 'seldel';
  }
  else if (act === 'rcat') S.rcat = b.dataset.v;
  else if (act === 'rflag') S.rflag = S.rflag === b.dataset.v ? '' : b.dataset.v;
  else if (act === 'delrec') { const r = S.rec[id];
    if (S.armed === 'r:' + id && r) { S.armed = null; S.open.delete(id); remove('recipes', id); toast('Изтрито: ' + r.name); } else S.armed = 'r:' + id; }
  else if (act === 'toplan') { const r = S.rec[id], d = document.getElementById('rp-day-' + id).value;
    create('meals', uid('g'), { date: d, kind: kindOf(r.cat), recipe: id, note: '', done: false, order: 99, noShop: false }); S.week = weekOf(d); toast(`${r.name}: ${dayName(d).toLowerCase()}`); }
  else if (act === 'delx') { const x = S.shop[id]; if (x) { remove('gshop', id); toast('Махнато: ' + x.name); } }
  else if (act === 'unbuy') { Object.entries(S.shop).forEach(([sid, x]) => { if (x.week !== b.dataset.w) return; if (x.extra) { if (x.done) patcher('gshop')(sid, { done: false }); } else remove('gshop', sid); }); toast('Отметките са махнати.'); }
  else if (act === 'copy') { const t = shopText(b.dataset.w);
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('Списъкът е копиран. Постави го в съобщение.'), () => toast('Не успях да копирам.')); return; }
  render();
});
root.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.act === 'pq') { S.pq = t.value; render(); }
  else if (t.dataset.act === 'rq') { S.rq = t.value; render(); }
});
root.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'done') { setM(t.dataset.id, { done: t.checked }); render(); return; }
  if (t.dataset.act === 'buy') {
    const k = t.dataset.k;
    if (t.dataset.x) patcher('gshop')(k, { done: t.checked });
    else if (t.checked) create('gshop', k, { week: t.dataset.w, key: k, done: true }); else remove('gshop', k);
    render(); return;
  }
  if (t.dataset.mid && S.meals[t.dataset.mid]) {
    const id = t.dataset.mid, k = t.dataset.f, v = t.type === 'checkbox' ? t.checked : t.value.trim();
    if (k === 'date' && !v) return;
    setM(id, { [k]: v }); if (k === 'date' || k === 'noShop') render(); else schedule(); return;
  }
  if (t.dataset.rid && S.rec[t.dataset.rid]) {
    const id = t.dataset.rid, k = t.dataset.f, r = S.rec[id]; let v = t.type === 'checkbox' ? t.checked : t.value.trim();
    if (k === 'name' && !v) { t.value = r.name; return; }
    if (k === 'keeps') { v = parseInt(v, 10); if (!(v >= 1)) { t.value = Number(r.keeps) || 1; return; } }
    if (k === 'ing') v = v.split('\n').map(s => s.trim()).filter(Boolean).map(s => ingLine(parseIng(s)));
    setR(id, { [k]: v }); if (t.type === 'checkbox' || k === 'cat') render(); else schedule();
  }
});
root.addEventListener('submit', e => {
  e.preventDefault(); if (S.readOnly) return;
  const f = e.target, act = f.dataset.act;
  if (act === 'addmeal') {
    const d = document.getElementById('am-day').value, rid = document.getElementById('am-rec').value, r = S.rec[rid];
    if (!d || !r) return;
    create('meals', uid('g'), { date: d, kind: kindOf(r.cat), recipe: rid, note: '', done: false, order: 99, noShop: false });
    toast(`${r.name}: ${dayName(d).toLowerCase()}`); render(); return;
  }
  if (act === 'addx') {
    const w = f.dataset.w, name = document.getElementById('ax-name-' + w).value.trim(); if (!name) return;
    create('gshop', uid('x'), { week: w, name, extra: true, done: false });
    render(); document.getElementById('ax-name-' + w).focus(); return;
  }
  if (act === 'addrec') {
    const name = document.getElementById('ar-name').value.trim(), cat = document.getElementById('ar-cat').value; if (!name) return;
    const id = uid('r'); create('recipes', id, { cat, name, check: false, note: '', keeps: cat === 'main' ? 3 : 1, auto: true, isNew: false, fav: false, ing: [] });
    S.open.add(id); S.rq = ''; S.rflag = ''; toast('Добавено. Попълни продуктите, за да влиза в пазаруването.'); render();
  }
});
setInterval(() => { if (ready() && !typing()) render(); }, 60000);

/* ---------- data ---------- */
(async () => {
  db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  if (!db) { S.noDb = true; render(); return; }
  const fail = e => { if (e && e.code === 'revoked') { S.noDb = true; render(); } };
  Object.keys(KEYS).forEach(col => db.collection(col).onSnapshot(s => {
    const m = {}; s.docs.forEach(d => m[d.id] = Object.assign({}, d.data()));
    Object.keys(LOCAL[col]).forEach(id => { if (!m[id]) m[id] = LOCAL[col][id]; });
    S[KEYS[col]] = m; S.got[col] = 1; schedule();
  }, fail));
})();
</script>

    <div class="acct"><span>Влязъл като <b id="acct-email"></b></span><button class="btn" type="button" onclick="zadSb.auth.signOut()">Изход</button></div>
  </section>
