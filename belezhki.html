<style>
/* Layout: one big notepad that saves itself while you type */
:root {
  --bg: #F2F4F8; --surface: #FFFFFF; --ink: #1D2330; --muted: #5F6878; --line: #DCE1EA;
  --accent: #2F5C8F; --accent-soft: #E0E9F4; --on-accent: #FFFFFF;
  --ok: #357552; --ok-soft: #DFEFE5; --wait: #94590A; --wait-soft: #FAEDD6; --danger: #B3261E; --danger-soft: #FBE7E5;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "Onest", "Segoe UI", Roboto, Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141A; --surface: #1A1F28; --ink: #E8ECF3; --muted: #9AA3B3; --line: #2C3340;
  --accent: #8DB4E6; --accent-soft: #1C2A3D; --on-accent: #0B1A2C;
  --ok: #7CC59A; --ok-soft: #1B3025; --wait: #E7B05A; --wait-soft: #372A15; --danger: #F2827A; --danger-soft: #3B1C1A;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11141A; --surface: #1A1F28; --ink: #E8ECF3; --muted: #9AA3B3; --line: #2C3340;
  --accent: #8DB4E6; --accent-soft: #1C2A3D; --on-accent: #0B1A2C;
  --ok: #7CC59A; --ok-soft: #1B3025; --wait: #E7B05A; --wait-soft: #372A15; --danger: #F2827A; --danger-soft: #3B1C1A;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 60px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance }
h1 { font-size: 1.9rem; line-height: 1.15 }
.sub { color: var(--muted); margin: 4px 0 0 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
button:disabled { cursor: default; opacity: .5 }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); letter-spacing: .02em; min-width: 0 }
.f input, .f select, .f textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: .95rem; color: var(--ink); width: 100%; min-width: 0 }
.edit-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center }
.edit-foot .grp { display: flex; gap: 6px; flex-wrap: wrap }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 14px; font-weight: 500 }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.pad { display: flex; flex-direction: column; gap: 8px }
.pad textarea { width: 100%; min-height: 60vh; resize: vertical; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
  padding: 16px; font-size: 1rem; line-height: 1.6; color: var(--ink); field-sizing: content }
.pad textarea::placeholder { color: var(--muted) }
.pad textarea:disabled { opacity: .6 }
.status { font-size: .85rem; color: var(--muted); min-height: 1.3em; margin: 0; text-align: right; font-variant-numeric: tabular-nums }
.status.err { color: var(--danger) }
.btn, .appnav a { -webkit-tap-highlight-color: transparent; touch-action: manipulation }
</style>

<div class="wrap app-wrap">
  <header>
    <h1>Бележки</h1>
    <p class="sub">Място за всякакви случайни неща. Записва се само, докато пишеш.</p>
  </header>
  <div class="pad">
    <textarea id="note" aria-label="Бележки" placeholder="Пиши тук…" spellcheck="true" disabled></textarea>
    <p class="status" id="status" role="status" aria-live="polite">Зареждане…</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script>
/* collection: notes/main {text, at}. A copy of the text also stays on this device (zad-note-draft),
   so nothing is lost offline; it is sent as soon as the connection is back. */
const ta = document.getElementById('note'), st = document.getElementById('status');
const DRAFT = 'zad-cache-note-draft'; // cleared on sign-out together with the other device copies
let db = null, ref = null, saved = '', timer = null, saving = false, lastAt = '';
const draft = () => { try { return JSON.parse(localStorage.getItem(DRAFT)); } catch (e) { return null; } };
const keepDraft = t => { try { localStorage.setItem(DRAFT, JSON.stringify({ text: t })); } catch (e) {} };
const dropDraft = () => { try { localStorage.removeItem(DRAFT); } catch (e) {} };
const hhmm = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('bg-BG', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const show = (msg, err) => { st.textContent = msg; st.classList.toggle('err', !!err); };
const idle = () => show(lastAt ? 'Записано · ' + hhmm(lastAt) : (ta.value ? 'Записано' : ''));

async function save() {
  clearTimeout(timer); timer = null;
  const text = ta.value; if (!db || text === saved) { if (text === saved) { dropDraft(); idle(); } return; }
  if (saving) { timer = setTimeout(save, 400); return; }
  saving = true; show('Записване…');
  const at = new Date().toISOString();
  try { await ref.set({ text, at }); saved = text; lastAt = at; if (ta.value === text) dropDraft(); idle(); }
  catch (e) { show(navigator.onLine ? 'Не се записа. Ще опитам пак.' : 'Без връзка: пазя бележката на това устройство и ще я запиша, щом има интернет.', true); setTimeout(() => { if (ta.value !== saved) save(); }, navigator.onLine ? 5000 : 30000); }
  finally { saving = false; if (ta.value !== saved && !timer) timer = setTimeout(save, 800); }
}
ta.addEventListener('input', () => { keepDraft(ta.value); show('Пишеш…'); clearTimeout(timer); timer = setTimeout(save, 800); });
ta.addEventListener('blur', () => { if (ta.value !== saved) save(); });
addEventListener('online', () => { if (ta.value !== saved) save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && ta.value !== saved) save(); });
addEventListener('pagehide', () => { if (ta.value !== saved) { keepDraft(ta.value); save(); } });

(async () => {
  db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  if (!db) { show('Бележките не могат да се заредят.', true); return; }
  ref = db.doc('notes/main');
  let first = true;
  ref.onSnapshot(s => {
    const d = s.exists ? s.data() : {}, remote = d.text || '';
    if (first) {
      first = false; saved = remote; lastAt = d.at || '';
      const local = draft();
      ta.value = local && local.text !== remote ? local.text : remote;
      ta.disabled = false;
      if (ta.value !== saved) save(); else { dropDraft(); idle(); }
      return;
    }
    if (remote === saved) return;
    // a change from the other phone: take it, unless you are typing something not yet saved here
    if (ta.value === saved) { const pos = ta.selectionStart; ta.value = remote; if (document.activeElement === ta) ta.setSelectionRange(pos, pos); }
    saved = remote; lastAt = d.at || lastAt;
    if (ta.value !== saved && !timer) timer = setTimeout(save, 800); else idle();
  }, () => show('Бележките не могат да се заредят. Опитай пак по-късно.', true));
})();
</script>
