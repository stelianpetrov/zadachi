<!doctype html><html lang="bg"><head><meta charset="utf-8"><title>Задачи и напомняния</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F1F5F4" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0F1514" media="(prefers-color-scheme: dark)"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Задачи"><meta name="referrer" content="strict-origin-when-cross-origin"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://dhydrtoxydaqxdvprjlp.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;1,7..72,500&family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="zadachi.css">

<div class="wrap app-wrap">
  <header>
    <h1>Задачи</h1>
    <p class="sub" id="today-line"></p>
  </header>
  <div id="root"><div class="state">Зареждане на задачите…</div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script src="zadachi.js"></script>

<div class="wrap app-wrap" style="margin-top:28px">
  <section class="card" style="display:grid;gap:10px">
    <div class="acct"><span>Влязъл като <b id="acct-email"></b></span><button class="btn" type="button" onclick="zadSb.auth.signOut()">Изход</button></div>
    <h3>Резервно копие</h3>
    <p class="sub" style="margin:0">Данните се пазят онлайн и се синхронизират между устройствата. Може да свалиш копие за всеки случай или да заредиш копие от файл. Зареждането добавя записите и презаписва тези със същото име.</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <button class="btn" type="button" onclick="zadBackup.exportFile()">Свали копие</button>
      <label class="btn" style="cursor:pointer">Зареди от файл<input type="file" accept="application/json,.json" hidden onchange="if(this.files[0])zadBackup.importFile(this.files[0]);this.value=''"></label>
    </div>
    <p class="hint" id="backup-msg" style="margin:0"></p>
  </section>
</div>
</body></html>
