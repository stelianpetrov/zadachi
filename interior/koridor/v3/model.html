<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Коридор – 3D v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e6df;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#22211e;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right));background:rgba(243,242,238,.92);border-top:1px solid #d8d5cd;backdrop-filter:blur(6px)}
  #bar button{font:500 13px 'IBM Plex Sans',system-ui,sans-serif;padding:8px 12px;border:1px solid #cfcbc1;background:#fffdf6;color:#22211e;border-radius:8px;cursor:pointer;min-height:36px}
  #bar button.on{background:#22211e;color:#fffdf6;border-color:#22211e}
  #bar .sep{width:1px;background:#d8d5cd;margin:2px 2px}
  #hint{position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));font-size:12px;color:#5d5a54;background:rgba(243,242,238,.85);padding:6px 10px;border-radius:8px;border:1px solid #d8d5cd;pointer-events:none}
  #tip{position:fixed;pointer-events:none;font-size:12px;background:#22211e;color:#fffdf6;padding:4px 8px;border-radius:6px;display:none;white-space:nowrap}
  #pad{position:fixed;right:calc(14px + env(safe-area-inset-right));display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px}
  #pad button{font-size:20px;border:1px solid #cfcbc1;background:rgba(255,253,246,.92);border-radius:10px;color:#22211e}
  @media (max-width:700px){#hint{display:none}#bar button{padding:7px 9px;font-size:12.5px}}
</style>
</head>
<body>
<div id="hint">Влачене: въртене · Колелце: приближаване · Клик върху врата: отваря/затваря</div>
<div id="tip"></div>
<div id="pad">
  <span></span><button data-k="f" aria-label="Напред">▲</button><span></span>
  <button data-k="l" aria-label="Наляво">◀</button><button data-k="b" aria-label="Назад">▼</button><button data-k="r" aria-label="Надясно">▶</button>
</div>
<div id="bar">
  <button data-view="overview" class="on">Общ изглед</button>
  <button data-view="entry">От входа</button>
  <button data-view="toEntry">Към входа</button>
  <button data-view="niche">Ниша</button>
  <button data-view="console">При банята</button>
  <button data-view="top">Отгоре</button>
  <button data-view="walk">Разходка</button>
  <span class="sep"></span>
  <button id="openAll">Отвори всички</button>
  <span class="sep"></span>
  <button id="tone">Цвят: Грейдж (v3)</button>
  <span class="sep"></span>
  <button data-mode="day">Ден</button>
  <button data-mode="evening" class="on">Вечер</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* Коридор v1. Units: metres. x along the long walls (0 = wall at the storage room),
   z into the room (0 = north wall with the entrance door), y up. Wall thickness T = 0.2. */
'use strict';
const H = 2.58, T = 0.2, L = 7.1775;
const zS = x => 1.385 - (x - 1.08) * (0.015 / (L - 1.08));   // south face of the narrow part (138.5 → 137 cm)

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.05, 100);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495;

// ---------- procedural textures ----------
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) t.repeat.set(repeat[0], repeat[1]);
  return t;
}
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// oak / walnut: vertical wavy grain
function woodTex(base, dark, lines) {
  return canvasTex(512, 1024, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < lines; i++) {
      const x0 = rnd() * w, amp = 3 + rnd() * 9, fr = 0.004 + rnd() * 0.01, ph = rnd() * 6;
      g.strokeStyle = dark; g.globalAlpha = 0.05 + rnd() * 0.16; g.lineWidth = 0.6 + rnd() * 2.2;
      g.beginPath();
      for (let y = 0; y <= h; y += 8) { const x = x0 + Math.sin(y * fr + ph) * amp + Math.sin(y * fr * 3.1) * amp * 0.25; y ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke();
    }
    g.globalAlpha = 1;
  });
}
// laminate: warm oak planks 20 x 138 cm laid along the corridor; one tile = 2.76 x 1.20 m
function laminateTex() {
  const W = 2048, Hh = 1024, rows = 6, rh = Hh / rows, bl = W / 2;
  const offs = [0, 0.37, 0.71, 0.18, 0.55, 0.86];
  const tones = ['#c39a6b', '#b98f60', '#c8a274', '#b48a5c', '#bf9566', '#c59e70'];
  return canvasTex(W, Hh, (g) => {
    for (let r = 0; r < rows; r++) {
      const y = r * rh;
      for (let k = -1; k < 3; k++) {
        const x = (k + offs[r]) * bl;
        g.save(); g.beginPath(); g.rect(Math.max(0, x), y, bl, rh); g.clip();
        g.fillStyle = tones[(r * 3 + k + 6) % tones.length]; g.fillRect(x, y, bl, rh);
        for (let i = 0; i < 26; i++) {
          const y0 = y + rnd() * rh, amp = 2 + rnd() * 6, fr = 0.003 + rnd() * 0.006, ph = rnd() * 6;
          g.strokeStyle = rnd() < 0.5 ? '#7a5432' : '#d9b78c'; g.globalAlpha = 0.06 + rnd() * 0.14; g.lineWidth = 0.8 + rnd() * 2;
          g.beginPath();
          for (let xx = x; xx <= x + bl; xx += 12) { const yy = y0 + Math.sin(xx * fr + ph) * amp; xx === x ? g.moveTo(xx, yy) : g.lineTo(xx, yy); }
          g.stroke();
        }
        g.globalAlpha = 1; g.restore();
        g.fillStyle = 'rgba(70,45,25,.55)'; g.fillRect(((x % W) + W) % W, y, 2, rh);   // short joint (wraps)
      }
      g.fillStyle = 'rgba(70,45,25,.45)'; g.fillRect(0, y, W, 2);                      // long joint
    }
  });
}
// herringbone parquet drawn on canvas; one tile = 12 plank widths square
function herringboneTex() {
  const W = 12, px = 1024, u = px / W, Lp = 6;           // plank 1 x 6 widths (≈9 x 54 cm)
  return canvasTex(px, px, (g) => {
    g.fillStyle = '#b58a5c'; g.fillRect(0, 0, px, px);
    const tones = ['#c09366', '#b4885a', '#a97d50', '#c79d70', '#b99062', '#ad8256'];
    const plank = (x, y, w, h, vertical) => {
      for (const ox of [-px, 0, px]) for (const oy of [-px, 0, px]) {
        const X = x + ox, Y = y + oy;
        if (X > px || Y > px || X + w < 0 || Y + h < 0) continue;
        g.fillStyle = tones[(Math.abs(Math.floor(x * 7 + y * 13)) >> 3) % tones.length];
        g.fillRect(X, Y, w, h);
        g.save(); g.beginPath(); g.rect(X, Y, w, h); g.clip();
        g.strokeStyle = '#6e4a2a';
        for (let k = 0; k < 7; k++) {
          g.globalAlpha = 0.08 + ((k * 37 + x) % 10) / 70; g.lineWidth = 1;
          g.beginPath();
          if (vertical) { const gx = X + ((k * 0.17 + (y % 7) * 0.05) % 1) * w; g.moveTo(gx, Y); g.bezierCurveTo(gx + 3, Y + h * .3, gx - 3, Y + h * .7, gx + 1, Y + h); }
          else { const gy = Y + ((k * 0.17 + (x % 7) * 0.05) % 1) * h; g.moveTo(X, gy); g.bezierCurveTo(X + w * .3, gy + 3, X + w * .7, gy - 3, X + w, gy + 1); }
          g.stroke();
        }
        g.globalAlpha = 1; g.restore();
        g.strokeStyle = 'rgba(60,38,20,.55)'; g.lineWidth = 1.4; g.strokeRect(X + .5, Y + .5, w - 1, h - 1);
      }
    };
    for (let s = -4; s <= 4; s++) for (let n = -16; n <= 16; n++) {
      const bx = n + s * Lp, by = n - s * Lp;
      const hx = ((bx % W) + W) % W, hy = ((by % W) + W) % W;
      plank(hx * u, hy * u, Lp * u, u, false);
      plank(hx * u, (hy + 1) * u, u, Lp * u, true);
    }
  });
}
// paint: soft noise
function paintTex(base) {
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const d = g.getImageData(0, 0, w, h);
    for (let i = 0; i < d.data.length; i += 4) { const n = (rnd() - 0.5) * 6; d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n; }
    g.putImageData(d, 0, 0);
  }, [4, 4]);
}
// large-format tiles 120 x 60 with joints (for the bathroom stub / landing)
function tileTex(base) {
  return canvasTex(512, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(120,110,95,${rnd() * 0.05})`; g.fillRect(rnd() * w, rnd() * h, 2, 1); }
    g.strokeStyle = '#a9a294'; g.lineWidth = 2; g.strokeRect(1, 1, w - 2, h - 2);
  });
}

const M = {
  wall: new THREE.MeshStandardMaterial({ color: 0xffffff, map: paintTex('#d9cfc2'), roughness: 0.92 }),
  ceil: new THREE.MeshStandardMaterial({ color: 0xf7f5f0, roughness: 0.95 }),
  floor: (() => { const t = laminateTex(); t.repeat.set(1 / 2.76, 1 / 1.2); return new THREE.MeshStandardMaterial({ map: t, roughness: 0.5 }); })(),
  oak: (() => { const t = woodTex('#c9a67c', '#7b5634', 90); return new THREE.MeshStandardMaterial({ map: t, roughness: 0.6 }); })(),
  walnut: (() => { const t = woodTex('#5a3d29', '#24160c', 110); return new THREE.MeshStandardMaterial({ map: t, roughness: 0.5 }); })(),
  trim: new THREE.MeshStandardMaterial({ color: 0xf4f1ea, roughness: 0.6 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x9a9690, metalness: 0.85, roughness: 0.3 }),
  black: new THREE.MeshStandardMaterial({ color: 0x22211e, metalness: 0.4, roughness: 0.45 }),
  pipe: new THREE.MeshStandardMaterial({ color: 0xe9e6df, metalness: 0.2, roughness: 0.4 }),
  led: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff0d8, emissiveIntensity: 1.6 }),
  stubWall: new THREE.MeshStandardMaterial({ color: 0xd9d4ca, roughness: 0.95, side: THREE.BackSide }),
  stubTile: new THREE.MeshStandardMaterial({ map: tileTex('#e4e0d8'), roughness: 0.4, side: THREE.BackSide }),
};

// ---------- helpers ----------
const hitables = [];
function box(x1, x2, y1, y2, z1, z2, mat, o = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2 - x1), Math.abs(y2 - y1), Math.abs(z2 - z1)), mat);
  m.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
  m.castShadow = o.cast !== false; m.receiveShadow = true;
  (o.parent || scene).add(m);
  if (!o.noHit) hitables.push(m);
  return m;
}
function cyl(x, z, y1, y2, r, mat, o = {}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, y2 - y1, o.seg || 24), mat);
  m.position.set(x, (y1 + y2) / 2, z);
  m.castShadow = o.cast !== false; m.receiveShadow = true;
  (o.parent || scene).add(m);
  if (!o.noHit) hitables.push(m);
  return m;
}
// local frame: origin at (x,z), turned by rotY; the front faces +z
function unit(x, z, rotY = 0, parent = scene) { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotY; parent.add(g); return g; }
// carcass without a front: sides, top, bottom, back
function carcass(f, x1, x2, y1, y2, d, mat, t = 0.018) {
  box(x1, x1 + t, y1, y2, 0, d, mat, { parent: f }); box(x2 - t, x2, y1, y2, 0, d, mat, { parent: f });
  box(x1, x2, y1, y1 + t, 0, d, mat, { parent: f }); box(x1, x2, y2 - t, y2, 0, d, mat, { parent: f });
  box(x1, x2, y1, y2, 0, 0.008, mat, { parent: f });
}

// interactive parts: smooth lerp and an "Отвори … / Затвори …" label
const inters = [];
function makeInter(obj, name, apply) {
  const rec = { obj, name, t: 0, target: 0, apply };
  obj.traverse(o => { if (o.isMesh) o.userData.inter = rec; });
  inters.push(rec); apply(0);
  return rec;
}
const label = r => (r.target > 0.5 ? 'Затвори ' : 'Отвори ') + r.name;

// hinged door; the leaf turns up to 1.45 rad (83°) so it never sweeps into a neighbour
function door(o) {
  const { hinge, u, n, w, h, mat, name } = o;
  const th = 0.04, clr = 0.025;
  const pivot = new THREE.Group();
  pivot.position.set(hinge[0] + u[0] * clr - n[0] * 0.03, 0, hinge[1] + u[1] * clr - n[1] * 0.03);
  scene.add(pivot);
  const lw = w - 2 * clr, lh = h - 0.012;
  const leaf = new THREE.Group(); pivot.add(leaf);
  box(0, lw, 0.008, lh, -th / 2, th / 2, mat, { parent: leaf });
  // lever handles both sides
  for (const s of [-1, 1]) {
    const hx = lw - 0.07;
    const rose = cyl(hx, s * (th / 2 + 0.006), 0.98, 1.06, 0.025, M.black, { parent: leaf, cast: false });
    rose.rotation.x = Math.PI / 2; rose.position.set(hx, 1.02, s * (th / 2 + 0.005)); rose.scale.set(1, 0.15, 1);
    box(hx - 0.12, hx + 0.01, 1.005, 1.025, s * (th / 2 + 0.045), s * (th / 2 + 0.065), M.black, { parent: leaf, cast: false });
    box(hx - 0.006, hx + 0.008, 1.005, 1.025, s * (th / 2), s * (th / 2 + 0.06), M.black, { parent: leaf, cast: false });
  }
  const a0 = Math.atan2(-u[1], u[0]), an = Math.atan2(-n[1], n[0]);
  let d = an - a0; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  const open = Math.sign(d) * 1.45;
  pivot.rotation.y = a0;
  return makeInter(pivot, name, t => { pivot.rotation.y = a0 + open * t; });
}
// stubs (unused in v1, ready for cabinets): drawer slides out along +z, flaps lift up or drop down
function drawer(f, x1, x2, y1, y2, d, front, name) {
  const g = new THREE.Group(); f.add(g);
  carcass(g, x1 + 0.01, x2 - 0.01, y1 + 0.01, y2 - 0.03, d - 0.05, M.trim, 0.012);
  box(x1, x2, y1, y2, d - 0.02, d, front, { parent: g });
  return makeInter(g, name, t => { g.position.z = t * (d * 0.75); });
}
function flapUp(f, x1, x2, y1, y2, z, mat, name) {
  const p = new THREE.Group(); p.position.set(0, y2, z); f.add(p);
  box(x1, x2, y1 - y2, 0, 0, 0.018, mat, { parent: p });
  return makeInter(p, name, t => { p.rotation.x = -t * 1.45; });
}
function flapDown(f, x1, x2, y1, y2, z, mat, name) {
  const p = new THREE.Group(); p.position.set(0, y1, z); f.add(p);
  box(x1, x2, 0, y2 - y1, 0, 0.018, mat, { parent: p });
  return makeInter(p, name, t => { p.rotation.x = t * 1.45; });
}

// ---------- walls (groups N, S, E, W) ----------
const walls = {};
for (const k of ['N', 'S', 'E', 'W']) { walls[k] = new THREE.Group(); scene.add(walls[k]); }
// wall running along x in a frame; openings [{a,b,h}] in that frame's x
function wallRun(parent, x1, x2, z1, z2, openings = []) {
  let x = x1;
  for (const o of openings.slice().sort((p, q) => p.a - q.a)) {
    if (o.a > x) box(x, o.a, 0, H, z1, z2, M.wall, { parent, noHit: true });
    box(o.a, o.b, o.h, H, z1, z2, M.wall, { parent, noHit: true });
    x = o.b;
  }
  if (x < x2) box(x, x2, 0, H, z1, z2, M.wall, { parent, noHit: true });
}
const DH = 2.05, EH = 2.10;   // ≈ door opening heights (not on the sketch)
// north wall: entrance door 109 at x 4.3775 … 5.4675
wallRun(walls.N, -T, L + T, -T, 0, [{ a: 4.3775, b: 5.4675, h: EH }]);
// west wall (storage door 70, z 1.05 … 1.75) built along x in a turned frame
{ const f = unit(0, 0, Math.PI / 2, walls.W); wallRun(f, -1.80, 0, -T, 0, [{ a: -1.75, b: -1.05, h: DH }]); }
// east wall (bathroom door 75, z 0.62 … 1.37)
{ const f = unit(L, 0, Math.PI / 2, walls.E); wallRun(f, -1.37 - T, 0, 0, T, [{ a: -1.37, b: -0.62, h: DH }]); }
// south: wide part (children's room door 88) + the 41.5 step + skewed narrow part (bedroom 90.5, living room 91)
wallRun(walls.S, -T, 1.08 + T, 1.80, 1.80 + T, [{ a: 0.095, b: 0.975, h: DH }]);
box(1.08, 1.08 + T, 0, H, 1.385 + T, 1.80, M.wall, { parent: walls.S, noHit: true });
const skew = Math.asin(0.015 / (L - 1.08));
const sF = unit(1.08, 1.385, skew, walls.S);
wallRun(sF, 0, L + T - 1.08, 0, T, [{ a: 3.3125 - 1.08, b: 4.2175 - 1.08, h: DH }, { a: 4.4575 - 1.08, b: 5.3675 - 1.08, h: DH }]);
// cutaway test: outward normal + a point on each wall
const wallInfo = { N: { p: [3.5, 0], n: [0, -1] }, S: { p: [3.5, 1.40], n: [0, 1] }, E: { p: [L, 0.7], n: [1, 0] }, W: { p: [0, 0.9], n: [-1, 0] } };

// ---------- floor and ceiling from the room outline ----------
const outline = [[0, 0], [L, 0], [L, zS(L)], [1.08, 1.385], [1.08, 1.80], [0, 1.80]];
function shapeMesh(pts, mat, y, up) {
  const s = new THREE.Shape(pts.map(([x, z]) => new THREE.Vector2(x, up ? -z : z)));
  const m = new THREE.Mesh(new THREE.ShapeGeometry(s), mat);
  m.rotation.x = up ? -Math.PI / 2 : Math.PI / 2; m.position.y = y; m.receiveShadow = true;
  scene.add(m); return m;
}
const floor = shapeMesh(outline, M.floor, 0, true);
const ceiling = new THREE.Group(); scene.add(ceiling);
ceiling.add(shapeMesh(outline, M.ceil, H, false));
// skirting (8 cm) along the long runs, broken at the doors
function skirt(x1, x2, z1, z2, parent) { box(x1, x2, 0, 0.08, z1, z2, M.trim, { parent, noHit: true, cast: false }); }
skirt(3.90, 4.3775, 0, 0.012, walls.N); skirt(5.4675, L, 0, 0.012, walls.N);
skirt(0, 0.095, 1.788, 1.80, walls.S); skirt(0.975, 1.08, 1.788, 1.80, walls.S);
{ const f = unit(1.08, 1.385, skew, walls.S); for (const [a, b] of [[0, 3.3125 - 1.08], [4.2175 - 1.08, 4.4575 - 1.08], [5.3675 - 1.08, L - 1.08]]) box(a, b, 0, 0.08, -0.012, 0, M.trim, { parent: f, noHit: true, cast: false }); }
skirt(0, 0.012, 0.578, 1.05, walls.W); skirt(0, 0.012, 1.75, 1.80, walls.W);
skirt(L - 0.012, L, 0, 0.62, walls.E);
skirt(1.068, 1.08, 1.385, 1.80, walls.S);

// ---------- column (58 x 15.5) and pipe ----------
const column = box(1.05, 1.205, 0, H, 0, 0.58, M.wall, { noHit: true });
const pipe = cyl(1.235, 0.125, 0, H, 0.0275, M.pipe, { noHit: true });
for (const y of [0.15, 1.3, 2.45]) cyl(1.235, 0.125, y, y + 0.03, 0.033, M.metal, { noHit: true, cast: false });

// ---------- door casings (both faces) ----------
function casingX(a, b, h, zFace, dir, parent = scene) {   // opening along x, wall face at zFace, casing sticks out along dir (±z)
  const t = 0.015, w = 0.07, z2 = zFace + dir * t, o = { parent, noHit: true, cast: false };
  box(a - w, a, 0, h + w, zFace, z2, M.trim, o);
  box(b, b + w, 0, h + w, zFace, z2, M.trim, o);

// ---------- walking: collision against the room outline, the column, the pipe and the open entrance door ----------
const R = 0.18;
function segDist(px, pz, ax, az, bx, bz) {
  const vx = bx - ax, vz = bz - az, l2 = vx * vx + vz * vz;
  let t = ((px - ax) * vx + (pz - az) * vz) / l2; t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - ax - t * vx, pz - az - t * vz);
}
function inside(px, pz) {
  let c = false;
  for (let i = 0, j = outline.length - 1; i < outline.length; j = i++) {
    const [xi, zi] = outline[i], [xj, zj] = outline[j];
    if ((zi > pz) !== (zj > pz) && px < (xj - xi) * (pz - zi) / (zj - zi) + xi) c = !c;
  }
  return c;
}
const obstacles = [[1.05, 1.205, 0, 0.58], [0, 1.05, 0, 0.58], [1.205, 3.90, 0, 0.45], [6.66, 7.18, 0, 0.6], [5.60, 6.20, 0, 0.36], [4.0, 4.26, 0.04, 0.30]];  // rectangles x1,x2,z1,z2
function free(px, pz) {
  if (!inside(px, pz)) return false;
  for (let i = 0, j = outline.length - 1; i < outline.length; j = i++) if (segDist(px, pz, ...outline[j], ...outline[i]) < R) return false;
  for (const [x1, x2, z1, z2] of obstacles) {
    const dx = Math.max(x1 - px, 0, px - x2), dz = Math.max(z1 - pz, 0, pz - z2);
    if (Math.hypot(dx, dz) < R) return false;
  }
  if (Math.hypot(px - 1.235, pz - 0.125) < R + 0.0275) return false;
  if (D.entry.t > 0.1) {   // open entrance leaf
    const a = D.entry.obj.rotation.y, px0 = D.entry.obj.position.x, pz0 = D.entry.obj.position.z;
    if (segDist(px, pz, px0, pz0, px0 + Math.cos(a) * 1.04, pz0 - Math.sin(a) * 1.04) < R + 0.03) return false;
  }
  return true;
}

function stepWalk(dt) {
  let f = 0, s = 0, turn = 0;
  if (keys.w || keys.arrowup || pad.f) f += 1;
  if (keys.s || keys.arrowdown || pad.b) f -= 1;
  if (keys.a) s -= 1; if (keys.d) s += 1;

  yawPitch.yaw += turn * dt * 1.6;
  const sp = 1.3 * dt, y = yawPitch.yaw;
  const dx = (-Math.sin(y) * f + Math.cos(y) * s) * sp, dz = (-Math.cos(y) * f - Math.sin(y) * s) * sp;
  const p = camera.position;
  if (free(p.x + dx, p.z)) p.x += dx;
  if (free(p.x, p.z + dz)) p.z += dz;
  p.y = 1.6; applyLook();

function checkOverlaps() {
  openAll(true, true);
  scene.updateMatrixWorld(true);
  const tight = b => b.clone().expandByScalar(-0.003);
  const movers = inters.map(r => ({ name: r.name, own: owner.get(r), b: tight(new THREE.Box3().setFromObject(r.obj)) }));
  const fixed = [{ name: 'колоната', b: new THREE.Box3().setFromObject(column) }, { name: 'тръбата', b: new THREE.Box3().setFromObject(pipe) }]
    .concat(fixedParts.map(f => ({ name: f.name, b: tight(new THREE.Box3().setFromObject(f.obj)) })));
  const out = [];
  for (let i = 0; i < movers.length; i++) {
    for (let j = i + 1; j < movers.length; j++) if (movers[i].b.intersectsBox(movers[j].b)) out.push(movers[i].name + ' ↔ ' + movers[j].name);
    for (const f of fixed) if (f.name !== movers[i].own && movers[i].b.intersectsBox(f.b)) out.push(movers[i].name + ' ↔ ' + f.name);
  }
  return out;
}

const clock = new THREE.Clock();
const _v = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  for (const r of inters) { if (Math.abs(r.t - r.target) > 1e-4) { r.t += (r.target - r.t) * Math.min(1, dt * 6); if (Math.abs(r.t - r.target) < 0.002) { r.t = r.target; mirrorsDirty = true; } r.apply(r.t); } }
  if (tween) {
    tween.k = Math.min(1, tween.k + dt * 1.3);
    const e = tween.k < 0.5 ? 2 * tween.k * tween.k : 1 - Math.pow(-2 * tween.k + 2, 2) / 2;
    camera.position.lerpVectors(tween.from.p, tween.to.p, e);
    controls.target.lerpVectors(tween.from.t, tween.to.t, e);
    if (tween.k >= 1) tween = null;
  }
  if (walk) stepWalk(dt); else controls.update();
  // cutaway: hide a wall when the camera stands behind it; hide the ceiling from above
  const c = camera.position, insideRoom = inside(c.x, c.z) && c.y < H;
  for (const k in walls) {
    const { p, n } = wallInfo[k];
    walls[k].visible = insideRoom || walk || ((c.x - p[0]) * n[0] + (c.z - p[1]) * n[1]) <= 0;
  }
  ceiling.visible = c.y < H - 0.05;
  stubs.visible = insideRoom || walk;
  for (const k in doorWall) D[k].obj.visible = walls[doorWall[k]].visible;
  if (mirrorsDirty && !inters.some(r => r.t !== r.target)) {
    const keep = [ceiling, stubs, ...Object.values(walls), ...Object.values(D).map(r => r.obj)].map(o => [o, o.visible]);
    keep.forEach(([o]) => { o.visible = true; });
    for (let pass = 0; pass < 2; pass++) for (const m of mirrorRT) { m.meshes.forEach(o => { o.visible = false; }); m.cam.update(renderer, scene); m.meshes.forEach(o => { o.visible = true; }); }
    keep.forEach(([o, v]) => { o.visible = v; });
    mirrorsDirty = false;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
