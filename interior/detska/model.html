<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Детска стая – 3D модел</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#f3efe8;--muted:#c4bcb0;--panel:rgba(32,28,25,.78);--line:rgba(255,255,255,.12);
  --hover:rgba(255,255,255,.08);--on:#e6dccb;--on-ink:#2a2420;--bg:#1c1917;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--ink:#2a2420;--muted:#5f564d;--panel:rgba(250,247,242,.86);--line:rgba(42,36,32,.14);--hover:rgba(42,36,32,.06);--on:#3b2f27;--on-ink:#f3efe8;--bg:#e7e1d8;}
}
:root[data-theme="light"]{--ink:#2a2420;--muted:#5f564d;--panel:rgba(250,247,242,.86);--line:rgba(42,36,32,.14);--hover:rgba(42,36,32,.06);--on:#3b2f27;--on-ink:#f3efe8;--bg:#e7e1d8;}
:root[data-theme="dark"]{--ink:#f3efe8;--muted:#c4bcb0;--panel:rgba(32,28,25,.78);--line:rgba(255,255,255,.12);--hover:rgba(255,255,255,.08);--on:#e6dccb;--on-ink:#2a2420;--bg:#1c1917;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Onest","Segoe UI","Helvetica Neue",sans-serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.card{position:fixed;left:20px;top:calc(20px + env(safe-area-inset-top,0px));background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;max-width:min(330px,calc(100% - 40px))}
.card h1{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:-.01em}
.card p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:10px;width:max-content;max-width:calc(100% - 24px)}
.group{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:4px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px}
button{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:transparent;border:0;border-radius:9px;padding:0 14px;min-height:40px;cursor:pointer}
button:hover{background:var(--hover)}
button[aria-pressed="true"]{background:var(--on);color:var(--on-ink)}
button:focus-visible{outline:2px solid #d9a760;outline-offset:2px}
.hint{position:fixed;right:20px;top:calc(20px + env(safe-area-inset-top,0px));font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
@media (max-width:700px){.hint{display:none}.card{padding:12px 14px}.card h1{font-size:17px}button{padding:0 10px;font-size:13px}}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
</style>
</head>
<body>
<div id="stage" aria-label="3D визуализация на детската стая"></div>
<div class="card">
  <h1>Детска стая</h1>
  <p>Кошара-легло 70 × 140, скрин с повивалник, гардероб, люлеещ се стол за кърмене, пейка под прозореца и рафт за играчки. ≈ 285 × 430 см, таван 270 см.</p>
</div>
<div class="hint">Влачи за завъртане, скрол или щипване за приближаване</div>
<div class="bar">
  <div class="group" role="group" aria-label="Гледна точка">
    <button type="button" data-view="overview" aria-pressed="true">Общ изглед</button>
    <button type="button" data-view="entry" aria-pressed="false">От входа</button>
    <button type="button" data-view="door2" aria-pressed="false">От втората врата</button>
    <button type="button" data-view="window" aria-pressed="false">От прозореца</button>
    <button type="button" data-view="crib" aria-pressed="false">Кошарата</button>
    <button type="button" data-view="top" aria-pressed="false">Отгоре</button>
  </div>
  <div class="group" role="group" aria-label="Осветление">
    <button type="button" data-mood="day" aria-pressed="true">Ден</button>
    <button type="button" data-mood="night" aria-pressed="false">Вечер</button>
  </div>
</div>
<div id="err">3D изгледът изисква WebGL. Отвори страницата в актуален браузър.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
  if(!window.THREE){document.getElementById('err').style.display='flex';return;}
  // Plan coordinates: x = left→right of the sketch, z = top→bottom. Metres.
  var W=2.85,D=4.30,H=2.7,T=0.2,STEPZ=2.53,WX=2.695; // right wall steps in by 15,5 cm below 253 cm
  var stage=document.getElementById('stage');
  var renderer;
  try{renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});}catch(e){document.getElementById('err').style.display='flex';return;}
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(stage.clientWidth,stage.clientHeight);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  stage.appendChild(renderer.domElement);
  var maxAniso=renderer.capabilities.getMaxAnisotropy();

  var scene=new THREE.Scene();
  var camera=new THREE.PerspectiveCamera(50,stage.clientWidth/stage.clientHeight,0.05,100);
  var controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=0.08;
  controls.minDistance=0.4;controls.maxDistance=16;controls.maxPolarAngle=Math.PI*0.495;

  // ---------- Procedural textures ----------
  function rnd(seed){var s=seed;return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;};}
  function canvasTex(w,h,draw,rep){
    var c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
    var t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=maxAniso;
    t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);return t;
  }
  function woodTex(base,dark,seed){
    return canvasTex(512,1024,function(g,w,h){
      var r=rnd(seed);g.fillStyle=base;g.fillRect(0,0,w,h);
      for(var i=0;i<200;i++){
        var x=r()*w,wd=0.5+r()*2.5;g.globalAlpha=0.04+r()*0.1;g.fillStyle=dark;
        g.beginPath();g.moveTo(x,0);
        for(var y=0;y<=h;y+=64){g.lineTo(x+Math.sin(y*0.006+i)*6*r(),y);}
        g.lineTo(x+wd,h);g.lineTo(x+wd,0);g.fill();
      }
      g.globalAlpha=1;
    });
  }
  function planks(){
    return canvasTex(1024,1024,function(g,w,h){
      var r=rnd(9),pw=64;
      for(var c=0;c<w/pw;c++){
        var y=-r()*400;
        while(y<h){var L=300+r()*400,t=r();
          g.fillStyle='rgb('+Math.round(205+t*20)+','+Math.round(178+t*18)+','+Math.round(140+t*16)+')';
          g.fillRect(c*pw,y,pw,L);
          for(var k=0;k<6;k++){g.globalAlpha=0.07;g.fillStyle='#8a6a45';g.fillRect(c*pw+r()*pw,y,1+r()*2,L);}
          g.globalAlpha=1;g.strokeStyle='rgba(110,80,50,0.35)';g.lineWidth=1.5;g.strokeRect(c*pw,y,pw,L);y+=L;}
      }
    },[W/2.2,D/2.2]);
  }
  function std(o){return new THREE.MeshStandardMaterial(o);}
  var M={
    wall:std({color:'#ece6dc',roughness:0.95}),
    ceiling:std({color:'#f3efe8',roughness:0.95}),
    oak:std({map:woodTex('#d6b88f','#8f6c45',3),roughness:0.6}),
    oakDark:std({map:woodTex('#b8946a','#6e5034',5),roughness:0.6}),
    white:std({color:'#f6f3ec',roughness:0.45}),
    sage:std({color:'#a9b79b',roughness:0.9}),
    sageDeep:std({color:'#8c9c7e',roughness:0.9}),
    blush:std({color:'#e7c6ba',roughness:1}),
    cream:std({color:'#efe7da',roughness:1}),
    mustard:std({color:'#d8b065',roughness:1}),
    terracotta:std({color:'#c98a6c',roughness:1}),
    sky:std({color:'#b9cbd3',roughness:1}),
    rug:std({color:'#ece3d4',roughness:1}),
    rugRing:std({color:'#d8c8b0',roughness:1}),
    black:std({color:'#232120',roughness:0.5}),
    brass:std({color:'#c9a86a',roughness:0.35,metalness:0.7}),
    ground:std({color:'#cfc9bd',roughness:1}),
    frame:std({color:'#f4f2ee',roughness:0.4}),
    leaf:std({color:'#5d7550',roughness:0.9}),
    pot:std({color:'#e0d6c6',roughness:0.7}),
    linen:std({color:'#dccfbd',roughness:1,side:THREE.DoubleSide}),
    sheer:std({color:'#f7f3ec',roughness:1,transparent:true,opacity:0.5,side:THREE.DoubleSide,depthWrite:false})
  };
  var glass=std({color:'#d8e6ea',roughness:0.05,transparent:true,opacity:0.2,depthWrite:false});
  var paper=std({color:'#fbf6ec',emissive:'#ffd9a0',emissiveIntensity:0,roughness:1,side:THREE.DoubleSide});
  var led=std({color:'#fff1d6',emissive:'#ffc98a',emissiveIntensity:0});

  function box(x1,x2,y1,y2,z1,z2,mat,opt){
    opt=opt||{};
    var m=new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x2-x1),Math.abs(y2-y1),Math.abs(z2-z1)),mat);
    m.position.set((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);
    m.castShadow=opt.cast!==false;m.receiveShadow=true;(opt.parent||scene).add(m);return m;
  }
  function cyl(x,z,r,y1,y2,mat,seg,r2){
    var m=new THREE.Mesh(new THREE.CylinderGeometry(r2==null?r:r2,r,y2-y1,seg||32),mat);
    m.position.set(x,(y1+y2)/2,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
  }
  function sph(x,y,z,r,mat,sx,sy,sz){var m=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),mat);m.position.set(x,y,z);if(sx)m.scale.set(sx,sy,sz);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
  var nightLights=[];
  function pl(x,y,z,color,int,dist){var l=new THREE.PointLight(color,0,dist||2,2);l.position.set(x,y,z);l.userData.night=int;scene.add(l);nightLights.push(l);return l;}

  // ---------- Shell ----------
  var ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),M.ground);
  ground.rotation.x=-Math.PI/2;ground.position.set(W/2,-0.005,D/2);ground.receiveShadow=true;scene.add(ground);
  var floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),std({map:planks(),roughness:0.55}));
  floor.rotation.x=-Math.PI/2;floor.position.set(W/2,0.001,D/2);floor.receiveShadow=true;scene.add(floor);
  var walls={N:new THREE.Group(),S:new THREE.Group(),Wt:new THREE.Group(),E:new THREE.Group()};
  var wallMats={};
  Object.keys(walls).forEach(function(k){wallMats[k]=M.wall.clone();scene.add(walls[k]);});
  function wb(side,x1,x2,y1,y2,z1,z2){box(x1,x2,y1,y2,z1,z2,wallMats[side],{parent:walls[side]});}
  var DH=2.05;
  // North wall: door 186,5 → 275 (88,5 cm)
  wb('N',-T,1.865,0,H,-T,0);wb('N',1.865,2.75,DH,H,-T,0);wb('N',2.75,W+T,0,H,-T,0);
  // West wall (to the terrace): window 125 → 305, sill 85
  wb('Wt',-T,0,0,H,0,1.25);wb('Wt',-T,0,0,0.85,1.25,3.05);wb('Wt',-T,0,2.4,H,1.25,3.05);wb('Wt',-T,0,0,H,3.05,D);
  // South wall
  wb('S',-T,W+T,0,H,D,D+T);
  // East wall with the 15,5 cm step; second door 357,5 → 426
  wb('E',W,W+T,0,H,-T,STEPZ);
  wb('E',WX,W+T,0,H,STEPZ,3.575);wb('E',WX,W+T,DH,H,3.575,4.26);wb('E',WX,W+T,0,H,4.26,D+T);
  var ceilMat=M.ceiling.clone();
  var ceil=box(0,W,H,H+0.02,0,D,ceilMat,{cast:false});
  // skirting
  box(0,1.865,0,0.07,0,0.012,M.white,{cast:false});box(0,0.012,0,0.07,0,D,M.white,{cast:false});box(0,WX,0,0.07,D-0.012,D,M.white,{cast:false});

  // Doors (closed leaves, light oak) + frames
  box(1.865,2.75,0,DH,-0.1,-0.06,M.oak,{parent:walls.N});box(1.93,2.0,0.99,1.01,-0.05,-0.02,M.brass,{parent:walls.N});
  box(1.84,1.865,0,DH+0.03,-0.02,0.01,M.white,{parent:walls.N});box(2.75,2.775,0,DH+0.03,-0.02,0.01,M.white,{parent:walls.N});box(1.84,2.775,DH,DH+0.03,-0.02,0.01,M.white,{parent:walls.N});
  box(WX+0.06,WX+0.1,0,DH,3.575,4.26,M.oak,{parent:walls.E});box(WX+0.02,WX+0.05,0.99,1.01,3.64,3.71,M.brass,{parent:walls.E});
  box(WX-0.01,WX+0.02,0,DH+0.03,3.55,3.575,M.white,{parent:walls.E});box(WX-0.01,WX+0.02,0,DH+0.03,4.26,4.285,M.white,{parent:walls.E});box(WX-0.01,WX+0.02,DH,DH+0.03,3.55,4.285,M.white,{parent:walls.E});

  // Window (terrace side)
  box(-T,0,0.83,0.85,1.23,3.07,M.white,{cast:false});
  box(-0.12,-0.1,0.85,2.4,1.25,3.05,glass,{cast:false});
  [[1.25,1.30],[3.0,3.05],[2.125,2.175]].forEach(function(a){box(-0.14,-0.06,0.85,2.4,a[0],a[1],M.frame);});
  [[0.85,0.9],[2.35,2.4]].forEach(function(a){box(-0.14,-0.06,a[0],a[1],1.25,3.05,M.frame);});
  box(-0.02,0.04,0.83,0.86,1.22,3.08,M.white);
  // terrace railing outside
  box(-1.4,-1.36,0.96,1.0,0.6,3.7,M.black);for(var rz=0.6;rz<=3.7;rz+=0.12)box(-1.39,-1.37,0,0.96,rz,rz+0.015,M.black);

  // Curtains (linen + sheer)
  var curtainObjs=[];
  curtainObjs.push(box(0.06,0.08,2.5,2.53,1.0,3.3,M.brass,{cast:false}));
  function curtain(z1,z2,mat,n){var w=(z2-z1)/n;for(var i=0;i<n;i++){var x=0.08+(i%2)*0.025;curtainObjs.push(box(x,x+0.012,0.47,2.5,z1+i*w,z1+(i+1)*w+0.01,mat,{cast:mat!==M.sheer}));}}
  curtain(1.0,1.36,M.linen,6);curtain(1.36,1.75,M.sheer,7);curtain(2.55,2.94,M.sheer,7);curtain(2.94,3.3,M.linen,6);

  // ---------- Painted sage arch behind the crib ----------
  var arch=new THREE.Mesh(new THREE.CircleGeometry(0.78,64,0,Math.PI),M.sage);
  arch.position.set(0.875,1.05,D-0.003);arch.rotation.y=Math.PI;walls.S.add(arch);
  var archBase=new THREE.Mesh(new THREE.PlaneGeometry(1.56,1.05),M.sage);archBase.position.set(0.875,0.525,D-0.003);archBase.rotation.y=Math.PI;walls.S.add(archBase);

  // ---------- Cot bed 70 × 140 (outer 76 × 145) ----------
  var cx1=0.15,cx2=1.60,cz1=3.51,cz2=4.27,ch=0.9;
  [[cx1,cz1],[cx2-0.045,cz1],[cx1,cz2-0.045],[cx2-0.045,cz2-0.045]].forEach(function(p){box(p[0],p[0]+0.045,0,ch,p[1],p[1]+0.045,M.white);});
  [cz1,cz2-0.045].forEach(function(z){box(cx1,cx2,ch-0.045,ch,z,z+0.045,M.white);box(cx1,cx2,0.2,0.25,z,z+0.045,M.white);
    for(var sx=cx1+0.08;sx<cx2-0.06;sx+=0.075){box(sx,sx+0.025,0.25,ch-0.045,z+0.01,z+0.035,M.oak);}});
  [cx1,cx2-0.045].forEach(function(x){box(x,x+0.045,0.2,ch-0.02,cz1+0.045,cz2-0.045,M.white);});
  box(cx1+0.05,cx2-0.05,0.25,0.37,cz1+0.05,cz2-0.05,M.cream);
  box(cx1+0.05,cx2-0.05,0.37,0.38,cz1+0.05,cz2-0.05,std({color:'#f8f5ef',roughness:1}),{cast:false});
  box(0.85,1.5,0.38,0.42,cz1+0.07,cz2-0.07,M.blush);box(0.85,0.9,0.38,0.45,cz1+0.07,cz2-0.07,M.blush);
  // teddy bear
  sph(0.42,0.5,3.88,0.09,M.mustard,1,1.1,0.9);sph(0.42,0.64,3.88,0.065,M.mustard);
  sph(0.42,0.69,3.83,0.025,M.mustard);sph(0.42,0.69,3.93,0.025,M.mustard);
  // mobile
  cyl(cx2-0.06,cz2-0.02,0.012,ch,1.55,M.oak,12);
  var arm=box(1.0,cx2-0.05,1.53,1.555,cz2-0.035,cz2-0.01,M.oak);
  var mob=new THREE.Group();scene.add(mob);
  var hoop=new THREE.Mesh(new THREE.TorusGeometry(0.16,0.006,8,48),M.oak);hoop.rotation.x=Math.PI/2;hoop.position.set(1.0,1.5,3.89);mob.add(hoop);
  box(0.995,1.005,1.5,1.55,4.2,4.25,M.oak);box(0.995,1.005,1.545,1.555,3.89,4.25,M.oak);
  [[M.blush,0],[M.sage,1],[M.mustard,2],[M.cream,3],[M.sky,4]].forEach(function(a){var ang=a[1]/5*6.283,x=1.0+Math.cos(ang)*0.16,z=3.89+Math.sin(ang)*0.16,y=1.25+(a[1]%2)*0.07;
    var s=new THREE.Mesh(new THREE.CylinderGeometry(0.002,0.002,1.5-y),M.cream);s.position.set(x,(1.5+y)/2,z);mob.add(s);
    var b=new THREE.Mesh(a[1]%2?new THREE.SphereGeometry(0.035,16,12):new THREE.OctahedronGeometry(0.04),a[0]);b.position.set(x,y,z);b.castShadow=true;mob.add(b);});

  // Nightstand + mushroom night light
  box(1.66,1.96,0.04,0.5,3.96,4.27,M.white);box(1.68,1.94,0,0.04,3.98,4.25,M.oak);box(1.66,1.96,0.25,0.26,3.955,3.96,M.oakDark,{cast:false});
  cyl(1.78,4.1,0.025,0.5,0.6,M.cream,16);var shroom=new THREE.Mesh(new THREE.SphereGeometry(0.07,24,12,0,6.283,0,Math.PI/2),paper);shroom.position.set(1.78,0.6,4.1);scene.add(shroom);
  pl(1.78,0.62,4.0,'#ffcf96',0.25,1.4);
  box(1.86,1.93,0.5,0.62,4.13,4.17,M.white);

  // ---------- Changing dresser 100 × 52 with changing pad ----------
  box(0.80,1.80,0.08,0.9,0,0.52,M.white);box(0.83,1.77,0,0.08,0.03,0.49,M.oak);
  [0.35,0.62].forEach(function(y){box(0.80,1.80,y-0.003,y+0.003,0.52,0.523,M.oakDark,{cast:false});});
  box(1.298,1.302,0.08,0.9,0.52,0.523,M.oakDark,{cast:false});
  [[1.05,0.22],[1.55,0.22],[1.05,0.49],[1.55,0.49],[1.05,0.76],[1.55,0.76]].forEach(function(p){var k=sph(p[0],p[1],0.535,0.017,M.oak);});
  box(0.80,1.80,0.9,0.93,0,0.52,M.oak);
  box(0.84,1.54,0.93,1.02,0.04,0.48,M.sage);box(0.88,1.50,0.93,0.99,0.08,0.44,M.cream);
