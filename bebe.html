<style>
/* Layout: one narrow column like a notebook page; summary card on top, category sections below, item rows expand in place */
:root {
  --bg: #F5F3F8; --surface: #FFFFFF; --ink: #2A2233; --muted: #6F6679; --line: #E3DDEA;
  --accent: #8E3B6B; --accent-soft: #F4E4EE; --on-accent: #FFFFFF;
  --ok: #3B7A58; --ok-soft: #E0EFE5; --wait: #9A5F0C; --wait-soft: #FAEDD6; --danger: #B3261E; --danger-soft: #FBE7E5;
  --display: "Literata", Georgia, "Times New Roman", serif;
  --body: "Onest", "Segoe UI", Roboto, Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16121A; --surface: #211B26; --ink: #F1ECF4; --muted: #A99FB2; --line: #372D3E;
  --accent: #E58BBE; --accent-soft: #3A2231; --on-accent: #2A1020;
  --ok: #7CC59A; --ok-soft: #1D3126; --wait: #E7B05A; --wait-soft: #392B15; --danger: #F2827A; --danger-soft: #3B1C1A;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16121A; --surface: #211B26; --ink: #F1ECF4; --muted: #A99FB2; --line: #372D3E;
  --accent: #E58BBE; --accent-soft: #3A2231; --on-accent: #2A1020;
  --ok: #7CC59A; --ok-soft: #1D3126; --wait: #E7B05A; --wait-soft: #392B15; --danger: #F2827A; --danger-soft: #3B1C1A;
  color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 60px }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance }
h1 { font-size: 1.9rem; line-height: 1.15 }
h1 em { font-style: italic; font-weight: 500; color: var(--accent) }
.sub { color: var(--muted); margin: 4px 0 0 }
.num { font-variant-numeric: tabular-nums }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px }
.banner { background: var(--wait-soft); color: var(--ink); border-radius: var(--r); padding: 12px 14px; font-size: .92rem }

/* summary */
.sum { display: grid; gap: 14px }
.sum-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px }
.big { font-family: var(--display); font-size: 2rem; font-weight: 600; line-height: 1 }
.big small { font-family: var(--body); font-size: .9rem; font-weight: 400; color: var(--muted) }
.counts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .9rem; color: var(--muted) }
.counts b { color: var(--ink); font-weight: 600 }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px }
.d-ok { background: var(--ok) } .d-wait { background: var(--wait) } .d-todo { background: var(--line); box-shadow: inset 0 0 0 1px var(--muted) }
.split { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: .9rem }
.split > div { display: flex; flex-direction: column; gap: 1px }
.split span { color: var(--muted) } .split b { font-weight: 600; font-size: 1.05rem }
.bar { display: flex; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden }
.bar span { display: block; height: 100% }
.bar .b { background: var(--ok) } .bar .o { background: var(--wait) }
.bar.money .s { background: var(--accent) } .bar.money .p { background: var(--accent); opacity: .35 }
.bar.money.over .s { background: var(--danger) }

/* tabs + filters */
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px; width: fit-content; max-width: 100% }
.tabs button { border: 0; background: none; padding: 7px 16px; border-radius: 99px; font-weight: 500; color: var(--muted) }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent) }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: .88rem }
.chipbtn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 500 }
.search { flex: 1 1 180px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 14px }

/* category */
.cat { display: flex; flex-direction: column; gap: 10px }
.cat-head { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: end }
.cat-head h2 { font-size: 1.35rem }
.cat-meta { font-size: .85rem; color: var(--muted); text-align: right }
.cat-head .bar { grid-column: 1 / -1; height: 5px }
.iconbtn { border: 1px solid transparent; background: none; border-radius: 8px; padding: 2px 8px; color: var(--muted); font-size: 1.1rem; line-height: 1 }
.iconbtn:hover { border-color: var(--line) }
.catmenu { display: grid; gap: 10px; background: var(--accent-soft); border-radius: var(--r); padding: 12px }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr } }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.empty-cat { padding: 14px 16px; color: var(--muted); font-size: .9rem }

/* item */
.item { border-top: 1px solid var(--line) }
.item:first-child { border-top: 0 }
.item-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 11px 14px }
.check { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--muted); background: var(--surface); margin: 0; display: grid; place-content: center; cursor: pointer }
.check::after { content: ""; width: 12px; height: 7px; border: solid var(--on-accent); border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px,-1px); opacity: 0 }
.check:checked { background: var(--ok); border-color: var(--ok) }
.check:checked::after { opacity: 1; border-color: var(--surface) }
.item-main { min-width: 0; text-align: left; border: 0; background: none; padding: 0; display: flex; flex-direction: column; gap: 3px }
.item-name { font-weight: 500; overflow-wrap: anywhere }
.item.is-bought .item-name { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted) }
.item-note { font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tags { display: flex; flex-wrap: wrap; gap: 4px }
.tag { font-size: .75rem; padding: 1px 8px; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis }
.t-ok { background: var(--ok-soft); color: var(--ok) } .t-wait { background: var(--wait-soft); color: var(--wait) }
.t-hi { background: var(--accent-soft); color: var(--accent) } .t-maybe { border: 1px dashed var(--muted); background: none }
.price { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap }
.price.est { color: var(--muted); font-weight: 400 }
.edit { padding: 4px 14px 16px 52px; display: grid; gap: 12px }
@media (max-width: 460px) { .edit { padding-left: 14px } }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.seg button { flex: 1; border: 0; background: var(--surface); padding: 8px 6px; font-size: .88rem; border-left: 1px solid var(--line) }
.seg button:first-child { border-left: 0 }
.seg button[aria-pressed="true"][data-v="todo"] { background: var(--line); font-weight: 600 }
.seg button[aria-pressed="true"][data-v="ordered"] { background: var(--wait-soft); color: var(--wait); font-weight: 600 }
.seg button[aria-pressed="true"][data-v="bought"] { background: var(--ok-soft); color: var(--ok); font-weight: 600 }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); letter-spacing: .02em; min-width: 0 }
.f input, .f select, .f textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: .95rem; color: var(--ink); width: 100%; min-width: 0 }
.f textarea { min-height: 64px; resize: vertical }
.toggles { display: flex; flex-wrap: wrap; gap: 6px }
.edit-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 14px; font-weight: 500 }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.btn.danger { color: var(--danger) }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--surface) }
a.link { color: var(--accent); font-size: .88rem }
.add { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--bg) }
.add input { flex: 1; min-width: 0; border: 1px dashed var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px }
.addcat { display: flex; gap: 8px }
.addcat input { flex: 1; min-width: 0; border: 1px dashed var(--muted); background: transparent; border-radius: 10px; padding: 9px 12px }

/* budget view */
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: baseline }
.kv dt { color: var(--muted) } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500 }
.kv .total { font-weight: 700; font-size: 1.1rem }
.tbl-wrap { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: .92rem }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
th:first-child, td:first-child { text-align: left; white-space: normal }
th { font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 500 }
tfoot td { font-weight: 600; border-bottom: 0 }
.over { color: var(--danger) }
.mini { display: grid; gap: 8px }
.mini-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px }
.mini-row small { color: var(--muted); grid-column: 1 / -1 }
.state { text-align: center; color: var(--muted); padding: 30px 10px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-size: .9rem; z-index: 20 }
@media (prefers-reduced-motion: no-preference) { .item-row, .chipbtn, .check { transition: background-color .15s, border-color .15s } }
</style>

<div class="wrap app-wrap" id="app">
  <header>
    <h1>Покупки за <em>бебка</em></h1>
    <p class="sub">Какво остава, какво е поръчано и откъде, и колко сме похарчили.</p>
  </header>
  <div id="root"><div class="state">Зареждане на списъка…</div></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script>
const S = { cats: {}, items: {}, settings: { budget: 0 }, got: { c: false, i: false }, noDb: false, readOnly: false,
  view: 'list', filter: 'all', q: '', open: new Set(), armed: null, catMenu: null, dirty: false };
let db = null;
try { const v = localStorage.getItem('bebka-view'); if (v === 'budget' || v === 'list') S.view = v; } catch (e) {}

const root = document.getElementById('root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => { n = Math.round((n || 0) * 100) / 100; return n.toLocaleString('bg-BG', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' €'; };
const parseNum = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pct = (a, b) => b > 0 ? Math.min(100, a / b * 100) : 0;

const status = it => it.bought ? 'bought' : it.ordered ? 'ordered' : 'todo';
const paid = it => (it.bought || it.ordered) && !it.gift ? (Number(it.price) || 0) : 0;
const planned = it => !it.bought && !it.ordered && !it.gift ? (Number(it.estimate) || 0) : 0;
const catsSorted = () => Object.entries(S.cats).sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0) || String(a[1].name).localeCompare(b[1].name, 'bg'));
const itemsOf = cid => Object.entries(S.items).filter(([, it]) => it.cat === cid)
  .sort((a, b) => (a[1].order ?? 0) - (b[1].order ?? 0) || String(a[1].name).localeCompare(b[1].name, 'bg'));
const stats = list => {
  const r = { n: 0, b: 0, o: 0, t: 0, spent: 0, planned: 0, sb: 0, so: 0, gifts: 0 };
  list.forEach(it => { r.n++; const s = status(it); if (s === 'bought') r.b++; else if (s === 'ordered') r.o++; else r.t++; r.spent += paid(it); r.planned += planned(it);
    if (s === 'bought') r.sb += paid(it); else if (s === 'ordered') r.so += paid(it);
    if (it.gift && s !== 'todo') r.gifts += Number(it.price) || 0; });
  return r;
};
const matches = it => {
  const f = S.filter, s = status(it);
  if (f === 'todo' && s !== 'todo') return false;
  if (f === 'ordered' && s !== 'ordered') return false;
  if (f === 'bought' && s !== 'bought') return false;
  if (f === 'high' && !it.priority) return false;
  if (S.q) { const h = [it.name, it.notes, it.store, it.gift].join(' ').toLowerCase(); if (!h.includes(S.q)) return false; }
  return true;
};

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }

/* ---------- writes: one at a time per document ---------- */
const pend = {}, busy = {}, unsynced = new Map();
function keepLocal(col, m, local) { unsynced.forEach((v, k) => { const [c, id] = k.split('/'); if (c === col && !m[id] && local[id]) m[id] = local[id]; else if (c === col && m[id]) unsynced.delete(k); }); return m; }
function onWriteError(e) {
  if (e && (e.code === 'invalid_argument' || e.code === 'not_granted')) {
    if (!S.readOnly) { S.readOnly = true; render(); }
  } else if (e && e.code === 'quota_exceeded') toast('Хранилището е пълно. Изтрийте ненужни неща.');
  else toast('Промяната не се записа. Проверете връзката и опитайте пак.');
}
async function save(col, id, patch, create) {
  if (!db || S.readOnly) return;
  const key = col + '/' + id;
  pend[key] = Object.assign(pend[key] || {}, patch);
  if (create) { pend[key].__create = true; unsynced.set(key, 1); }
  if (busy[key]) return;
  busy[key] = true;
  while (pend[key]) {
    const p = pend[key]; delete pend[key];
    const isNew = p.__create; delete p.__create;
    const ref = db.collection(col).doc(id);
    let full = null;
    try {
      if (isNew) {
        const local = col === 'items' ? S.items[id] : col === 'categories' ? S.cats[id] : S.settings;
        full = Object.assign({}, local, p);
        await ref.set(full);
        unsynced.delete(key);
      } else await ref.update(p);
    } catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 800)); try { isNew ? await ref.set(full) : await ref.update(p); if (isNew) unsynced.delete(key); } catch (e2) { onWriteError(e2); } }
      else onWriteError(e);
    }
  }
  busy[key] = false;
}
async function remove(col, id) { if (!db || S.readOnly) return; try { await db.collection(col).doc(id).delete(); } catch (e) { onWriteError(e); } }
function setItem(id, patch) { Object.assign(S.items[id], patch); save('items', id, patch); }
function setCat(id, patch) { Object.assign(S.cats[id], patch); save('categories', id, patch); }

/* ---------- rendering ---------- */
const typing = () => { const a = document.activeElement; return a && root.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox'; };
function schedule() { if (typing()) S.dirty = true; else render(); }
root.addEventListener('focusout', () => setTimeout(() => { if (S.dirty && !typing()) { S.dirty = false; render(); } }, 0));

function bar(b, o, n) { return `<div class="bar" role="img" aria-label="Купени ${b} и поръчани ${o} от ${n}"><span class="b" style="width:${pct(b, n)}%"></span><span class="o" style="width:${pct(o, n)}%"></span></div>`; }
function moneyBar(spent, plan, budget) {
  if (!budget) return '';
  const over = spent + plan > budget;
  return `<div class="bar money${spent > budget ? ' over' : ''}" role="img" aria-label="Похарчено ${money(spent)} от бюджет ${money(budget)}"><span class="s" style="width:${pct(spent, budget)}%"></span><span class="p" style="width:${Math.max(0, Math.min(100 - pct(spent, budget), pct(plan, budget)))}%"></span></div>`;
}

function render() {
  if (S.noDb) { root.innerHTML = `<div class="card state">Нямаш достъп до данните. Излез и влез отново.</div>`; return; }
  if (!S.got.c || !S.got.i) { root.innerHTML = `<div class="state">Зареждане на списъка…</div>`; return; }
  const all = Object.values(S.items), st = stats(all), budget = Number(S.settings.budget) || 0;
  const dis = S.readOnly ? ' disabled' : '';
  let h = '';
  if (S.readOnly) h += `<div class="banner">Можете да разглеждате списъка, но не и да го променяте. Помолете собственика да ви даде достъп „Contributor“ или „Editor“ от бутона за споделяне.</div>`;
  h += `<section class="card sum" aria-label="Обобщение">
    <div class="sum-top">
      <div><div class="big num">${money(st.spent)} <small>похарчени общо${budget ? ' от ' + money(budget) : ''}</small></div></div>
      <div class="counts num"><span><span class="dot d-ok"></span><b>${st.b}</b> купени</span><span><span class="dot d-wait"></span><b>${st.o}</b> поръчани</span><span><span class="dot d-todo"></span><b>${st.t}</b> остават</span></div>
    </div>
    ${bar(st.b, st.o, st.n)}
    <div class="split num"><div><span><span class="dot d-ok"></span>За купени</span><b>${money(st.sb)}</b></div><div><span><span class="dot d-wait"></span>За поръчани</span><b>${money(st.so)}</b></div>${st.gifts ? `<div><span>Подаръци (не влизат в сумата)</span><b>${money(st.gifts)}</b></div>` : ''}</div>
    <div class="counts">${st.n ? `<span>${Math.round(pct(st.b + st.o, st.n))}% от списъка е взето или поръчано</span>` : ''}${st.planned ? `<span>Предстоят още около <b class="num">${money(st.planned)}</b></span>` : ''}</div>
  </section>`;
  h += `<div class="tabs" role="group" aria-label="Изглед"><button data-act="view" data-v="list" aria-pressed="${S.view === 'list'}">Списък</button><button data-act="view" data-v="budget" aria-pressed="${S.view === 'budget'}">Бюджет и магазини</button></div>`;
  h += S.view === 'budget' ? budgetView(all, st, budget, dis) : listView(dis);
  root.innerHTML = h;
}

function listView(dis) {
  const F = [['all', 'Всички'], ['todo', 'За купуване'], ['ordered', 'Поръчани'], ['bought', 'Купени'], ['high', 'Важни']];
  let h = `<div class="tools"><div class="chips" role="group" aria-label="Филтър">${F.map(([v, l]) => `<button class="chipbtn" data-act="filter" data-v="${v}" aria-pressed="${S.filter === v}">${l}</button>`).join('')}</div>
    <input class="search" id="search" type="search" placeholder="Търси…" value="${esc(S.q)}" aria-label="Търси в списъка"></div>`;
  const cats = catsSorted();
  if (!cats.length) h += `<div class="card state">Списъкът е празен. Добавете първата категория отдолу, например „Основни“.</div>`;
  const stores = [...new Set(Object.values(S.items).map(i => (i.store || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'bg'));
  h += `<datalist id="stores">${stores.map(s => `<option value="${esc(s)}"></option>`).join('')}</datalist>`;
  const filtering = S.filter !== 'all' || S.q;
  let shown = 0;
  cats.forEach(([cid, c], idx) => {
    const its = itemsOf(cid), cs = stats(its.map(x => x[1]));
    const vis = its.filter(([, it]) => matches(it));
    if (filtering && !vis.length) return;
    shown++;
    const cb = Number(c.budget) || 0;
    h += `<section class="cat" aria-labelledby="h-${esc(cid)}">
      <div class="cat-head">
        <div style="display:flex;align-items:center;gap:6px;min-width:0"><h2 id="h-${esc(cid)}">${esc(c.name)}</h2><button class="iconbtn" data-act="catmenu" data-id="${esc(cid)}" aria-label="Настройки на категорията" aria-expanded="${S.catMenu === cid}">⋯</button></div>
        <div class="cat-meta num">${cs.b + cs.o}/${cs.n} · ${money(cs.spent)}${cb ? ' от ' + money(cb) : ''}${cs.so ? `<br>купени ${money(cs.sb)} · поръчани ${money(cs.so)}` : ''}</div>
        ${bar(cs.b, cs.o, cs.n)}
      </div>`;
    if (S.catMenu === cid) {
      h += `<div class="catmenu">
        <div class="row2"><label class="f">Име<input id="cn-${esc(cid)}" data-cat="${esc(cid)}" data-cf="name" value="${esc(c.name)}"${dis}></label>
        <label class="f">Бюджет за категорията, €<input id="cb-${esc(cid)}" data-cat="${esc(cid)}" data-cf="budget" inputmode="decimal" value="${cb || ''}" placeholder="по желание"${dis}></label></div>
        <div class="edit-foot"><div style="display:flex;gap:6px"><button class="btn" data-act="catmove" data-id="${esc(cid)}" data-d="-1"${idx === 0 ? ' disabled' : ''}${dis}>↑ По-горе</button><button class="btn" data-act="catmove" data-id="${esc(cid)}" data-d="1"${idx === cats.length - 1 ? ' disabled' : ''}${dis}>↓ По-долу</button></div>
        <button class="btn danger${S.armed === 'cat:' + cid ? ' armed' : ''}" data-act="catdel" data-id="${esc(cid)}"${dis}>${S.armed === 'cat:' + cid ? (its.length ? `Да, изтрий и ${its.length} неща` : 'Да, изтрий') : 'Изтрий категорията'}</button></div>
      </div>`;
    }
    h += `<div class="list">`;
    if (!vis.length) h += `<div class="empty-cat">Още няма нищо тук.</div>`;
    vis.forEach(([id, it]) => { h += itemHtml(id, it, dis); });
    if (!S.readOnly) h += `<form class="add" data-act="additem" data-cat="${esc(cid)}"><input id="add-${esc(cid)}" placeholder="Добави нещо в „${esc(c.name)}“…" aria-label="Ново нещо в ${esc(c.name)}"><button class="btn" type="submit">Добави</button></form>`;
    h += `</div></section>`;
  });
  if (filtering && !shown) h += `<div class="card state">Нищо не отговаря на филтъра.</div>`;
  if (!S.readOnly) h += `<form class="addcat" data-act="addcat"><input id="newcat" placeholder="Нова категория, напр. „За болницата“" aria-label="Нова категория"><button class="btn" type="submit">Добави категория</button></form>`;
  return h;
}

function itemHtml(id, it, dis) {
  const s = status(it), open = S.open.has(id), store = (it.store || '').trim();
  let tags = '';
  if (s === 'ordered') tags += `<span class="tag t-wait">Поръчано${store ? ' · ' + esc(store) : ''}</span>`;
  if (s === 'bought') tags += `<span class="tag t-ok">Купено${store ? ' · ' + esc(store) : ''}</span>`;
  if (it.priority) tags += `<span class="tag t-hi">Важно</span>`;
  if (it.maybe) tags += `<span class="tag t-maybe">Под въпрос</span>`;
  if (it.gift) tags += `<span class="tag">Подарък от ${esc(it.gift)}</span>`;
  const price = (s !== 'todo' && Number(it.price)) ? `<span class="price">${money(it.price)}</span>`
    : Number(it.estimate) ? `<span class="price est" title="ориентировъчна цена">~${money(it.estimate)}</span>` : '<span></span>';
  let h = `<div class="item${s === 'bought' ? ' is-bought' : ''}">
    <div class="item-row">
      <input type="checkbox" class="check" id="chk-${esc(id)}" data-act="bought" data-id="${esc(id)}" ${it.bought ? 'checked' : ''} aria-label="Купено: ${esc(it.name)}"${dis}>
      <button class="item-main" data-act="toggle" data-id="${esc(id)}" aria-expanded="${open}">
        <span class="item-name">${esc(it.name)}</span>
        ${it.notes ? `<span class="item-note">${esc(it.notes)}</span>` : ''}
        ${tags ? `<span class="tags">${tags}</span>` : ''}
      </button>
      ${price}
    </div>`;
  if (open) {
    const f = (k, label, extra = '') => `<label class="f">${label}<input id="f-${k}-${esc(id)}" data-id="${esc(id)}" data-f="${k}" value="${esc(k === 'price' || k === 'estimate' ? (Number(it[k]) || '') : it[k])}" ${extra}${dis}></label>`;
    h += `<div class="edit">
      <div class="seg" role="group" aria-label="Статус">${[['todo', 'За купуване'], ['ordered', 'Поръчано'], ['bought', 'Купено']].map(([v, l]) => `<button data-act="status" data-id="${esc(id)}" data-v="${v}" aria-pressed="${s === v}"${dis}>${l}</button>`).join('')}</div>
      ${f('name', 'Име')}
      <div class="row2">${f('store', 'Откъде (магазин / сайт)', 'list="stores" placeholder="напр. Amazon, Айко"')}${f('gift', 'Подарък от', 'placeholder="ако е подарено"')}</div>
      <div class="row2">${f('price', 'Платена цена, €', 'inputmode="decimal" placeholder="0"')}${f('estimate', 'Ориентировъчна цена, €', 'inputmode="decimal" placeholder="за бюджета"')}</div>
      <label class="f">Връзка към продукта<input id="f-link-${esc(id)}" data-id="${esc(id)}" data-f="link" type="url" inputmode="url" value="${esc(it.link)}" placeholder="https://"${dis}></label>
      ${it.link && /^https?:\/\//i.test(it.link) ? `<a class="link" href="${esc(it.link)}" target="_blank" rel="noopener">Отвори връзката ↗</a>` : ''}
      <label class="f">Бележки<textarea id="f-notes-${esc(id)}" data-id="${esc(id)}" data-f="notes" placeholder="размер, цвят, модел, кой ще го донесе…"${dis}>${esc(it.notes)}</textarea></label>
      <div class="row2"><label class="f">Категория<select id="f-cat-${esc(id)}" data-id="${esc(id)}" data-f="cat"${dis}>${catsSorted().map(([cid, c]) => `<option value="${esc(cid)}"${cid === it.cat ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <div class="f">Отметки<div class="toggles"><button class="chipbtn" data-act="flag" data-f="priority" data-id="${esc(id)}" aria-pressed="${!!it.priority}"${dis}>Важно</button><button class="chipbtn" data-act="flag" data-f="maybe" data-id="${esc(id)}" aria-pressed="${!!it.maybe}"${dis}>Под въпрос</button></div></div></div>
      <div class="edit-foot"><button class="btn" data-act="toggle" data-id="${esc(id)}">Готово</button>
      <button class="btn danger${S.armed === 'item:' + id ? ' armed' : ''}" data-act="delitem" data-id="${esc(id)}"${dis}>${S.armed === 'item:' + id ? 'Да, изтрий' : 'Изтрий'}</button></div>
    </div>`;
  }
  return h + `</div>`;
}

function budgetView(all, st, budget, dis) {
  const left = budget - st.spent - st.planned;
  let h = `<section class="card" style="display:grid;gap:14px">
    <h3>Бюджет</h3>
    <label class="f">Общ бюджет за бебето, €<input id="budget" data-budget="1" inputmode="decimal" value="${budget || ''}" placeholder="напр. 2000"${dis}></label>
    ${moneyBar(st.spent, st.planned, budget)}
    <dl class="kv">
      <dt>Платено за купени неща</dt><dd>${money(st.sb)}</dd>
      <dt>Платено за поръчани (още не са пристигнали)</dt><dd>${money(st.so)}</dd>
      <dt>Похарчено общо</dt><dd>${money(st.spent)}</dd>
      ${st.gifts ? `<dt>Подаръци (не влизат в похарченото)</dt><dd>${money(st.gifts)}</dd>` : ''}
      <dt>Предстои по ориентировъчни цени</dt><dd>${money(st.planned)}</dd>
      ${budget ? `<dt class="total">${left >= 0 ? 'Остава свободно' : 'Над бюджета с'}</dt><dd class="total${left < 0 ? ' over' : ''}">${money(Math.abs(left))}</dd>` : ''}
    </dl>
    ${budget ? '' : '<p class="sub" style="margin:0">Въведете бюджет, за да виждате колко остава. Ориентировъчните цени се попълват във всяко нещо от списъка.</p>'}
  </section>`;
  h += `<section class="card"><h3 style="margin-bottom:8px">По категории</h3><div class="tbl-wrap"><table>
    <thead><tr><th>Категория</th><th>Взети</th><th>Купени</th><th>Поръчани</th><th>Общо</th><th>Предстои</th><th>Бюджет</th></tr></thead><tbody>`;
  catsSorted().forEach(([cid, c]) => {
    const cs = stats(itemsOf(cid).map(x => x[1])), cb = Number(c.budget) || 0;
    h += `<tr><td>${esc(c.name)}</td><td>${cs.b + cs.o}/${cs.n}</td><td>${money(cs.sb)}</td><td>${money(cs.so)}</td><td>${money(cs.spent)}</td><td>${cs.planned ? money(cs.planned) : '–'}</td><td class="${cb && cs.spent + cs.planned > cb ? 'over' : ''}">${cb ? money(cb) : '–'}</td></tr>`;
  });
  h += `</tbody><tfoot><tr><td>Общо</td><td>${st.b + st.o}/${st.n}</td><td>${money(st.sb)}</td><td>${money(st.so)}</td><td>${money(st.spent)}</td><td>${st.planned ? money(st.planned) : '–'}</td><td>${budget ? money(budget) : '–'}</td></tr></tfoot></table></div></section>`;
  const byStore = {};
  all.filter(it => it.bought || it.ordered).forEach(it => { const k = (it.store || '').trim() || 'Без посочен магазин'; (byStore[k] = byStore[k] || { n: 0, sum: 0, names: [] }); byStore[k].n++; byStore[k].sum += paid(it); byStore[k].names.push(it.name); });
  const stores = Object.entries(byStore).sort((a, b) => b[1].sum - a[1].sum);
  h += `<section class="card mini"><h3>Откъде сме взели</h3>${stores.length ? stores.map(([k, v]) => `<div class="mini-row"><span>${esc(k)}</span><span class="num">${money(v.sum)}</span><small>${esc(v.names.join(', '))}</small></div>`).join('') : '<p class="sub" style="margin:0">Още няма поръчани или купени неща.</p>'}</section>`;
  const waiting = all.filter(it => it.ordered && !it.bought);
  h += `<section class="card mini"><h3>Чакаме доставка</h3>${waiting.length ? waiting.map(it => `<div class="mini-row"><span>${esc(it.name)}</span><span class="num">${Number(it.price) ? money(it.price) : ''}</span><small>${esc(it.store || 'без посочен магазин')}${it.gift ? ' · подарък от ' + esc(it.gift) : ''}</small></div>`).join('') + '<p class="sub" style="margin:0;font-size:.85rem">Когато пристигне, отметнете го като купено в списъка.</p>' : '<p class="sub" style="margin:0">Няма неполучени поръчки.</p>'}</section>`;
  const gifts = all.filter(it => it.gift);
  if (gifts.length) h += `<section class="card mini"><h3>Подаръци</h3>${gifts.map(it => `<div class="mini-row"><span>${esc(it.name)}</span><span>${esc(it.gift)}</span></div>`).join('')}</section>`;
  return h;
}

/* ---------- events ---------- */
root.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'FORM' || b.tagName === 'INPUT') return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act !== 'delitem' && act !== 'catdel') S.armed = null;
  if (act === 'view') { S.view = b.dataset.v; try { localStorage.setItem('bebka-view', S.view); } catch (err) {} }
  else if (act === 'filter') S.filter = b.dataset.v;
  else if (act === 'toggle') { S.open.has(id) ? S.open.delete(id) : S.open.add(id); }
  else if (act === 'status') { const v = b.dataset.v; setItem(id, v === 'todo' ? { ordered: false, bought: false } : v === 'ordered' ? { ordered: true, bought: false } : { bought: true }); }
  else if (act === 'flag') setItem(id, { [b.dataset.f]: !S.items[id][b.dataset.f] });
  else if (act === 'delitem') {
    if (S.armed === 'item:' + id) { S.armed = null; S.open.delete(id); const name = S.items[id].name; delete S.items[id]; remove('items', id); toast('Изтрито: ' + name); }
    else S.armed = 'item:' + id;
  }
  else if (act === 'catmenu') S.catMenu = S.catMenu === id ? null : id;
  else if (act === 'catmove') {
    const cats = catsSorted(), i = cats.findIndex(c => c[0] === id), j = i + Number(b.dataset.d);
    if (j >= 0 && j < cats.length) { cats.forEach(([cid], k) => { const o = k === i ? j : k === j ? i : k; if (S.cats[cid].order !== o) setCat(cid, { order: o }); }); }
  }
  else if (act === 'catdel') {
    if (S.armed === 'cat:' + id) { S.armed = null; S.catMenu = null; itemsOf(id).forEach(([iid]) => { delete S.items[iid]; remove('items', iid); }); const name = S.cats[id].name; delete S.cats[id]; remove('categories', id); toast('Изтрита категория: ' + name); }
    else S.armed = 'cat:' + id;
  }
  render();
});
root.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'bought') { setItem(t.dataset.id, { bought: t.checked }); render(); return; }
  if (t.dataset.f && t.dataset.id && S.items[t.dataset.id]) {
    const k = t.dataset.f; let v = t.value;
    if (k === 'price' || k === 'estimate') v = parseNum(v) ?? 0;
    else if (k === 'name') { v = v.trim(); if (!v) { t.value = S.items[t.dataset.id].name; return; } }
    else v = v.trim();
    if (k === 'cat') { setItem(t.dataset.id, { cat: v, order: itemsOf(v).length }); render(); return; }
    setItem(t.dataset.id, { [k]: v }); schedule(); return;
  }
  if (t.dataset.cat && S.cats[t.dataset.cat]) {
    const k = t.dataset.cf; let v = k === 'budget' ? (parseNum(t.value) ?? 0) : t.value.trim();
    if (k === 'name' && !v) { t.value = S.cats[t.dataset.cat].name; return; }
    setCat(t.dataset.cat, { [k]: v }); schedule(); return;
  }
  if (t.dataset.budget) { const v = parseNum(t.value) ?? 0; S.settings.budget = v; save('settings', 'main', { budget: v }, !S.settingsExists); S.settingsExists = true; schedule(); }
});
root.addEventListener('input', e => { if (e.target.id === 'search') { S.q = e.target.value.trim().toLowerCase(); const pos = e.target.selectionStart; render(); const s = document.getElementById('search'); s.focus(); try { s.setSelectionRange(pos, pos); } catch (err) {} } });
root.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, input = f.querySelector('input'), name = input.value.trim(); if (!name || S.readOnly) return;
  if (f.dataset.act === 'additem') {
    const cid = f.dataset.cat, id = uid('i'), order = Math.max(-1, ...itemsOf(cid).map(x => x[1].order ?? 0)) + 1;
    S.items[id] = { name, cat: cid, order, bought: false, ordered: false, store: '', price: 0, estimate: 0, link: '', notes: '', gift: '', priority: false, maybe: false };
    save('items', id, {}, true); render();
    const again = document.getElementById('add-' + cid); if (again) again.focus();
  } else if (f.dataset.act === 'addcat') {
    const id = uid('c'), order = Math.max(-1, ...Object.values(S.cats).map(c => c.order ?? 0)) + 1;
    S.cats[id] = { name, order, budget: 0 }; save('categories', id, {}, true); render();
  }
});

/* ---------- data ---------- */
(async () => {
  db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  if (!db) { S.noDb = true; render(); return; }
  const fail = e => { if (e && e.code === 'revoked') { S.noDb = true; render(); } };
  db.collection('categories').onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = Object.assign({}, d.data())); S.cats = keepLocal('categories', m, S.cats); S.got.c = true; schedule(); }, fail);
  db.collection('items').onSnapshot(s => { const m = {}; s.docs.forEach(d => m[d.id] = Object.assign({}, d.data())); S.items = keepLocal('items', m, S.items); S.got.i = true; schedule(); }, fail);
  db.doc('settings/main').onSnapshot(d => { S.settingsExists = d.exists; S.settings = Object.assign({ budget: 0 }, d.exists ? d.data() : {}); schedule(); }, fail);
})();
</script>

</body></html>
